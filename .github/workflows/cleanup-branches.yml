name: 머지된 브랜치 정리

# 손으로만 돌립니다(Actions → 머지된 브랜치 정리 → Run workflow).
#
# 지우는 것: PR 이 "머지"로 끝난 브랜치.
# 남기는 것: main, 지금 작업 브랜치(keep 입력), 열린 PR 이 있는 브랜치,
#            PR 없이 만들어졌거나 머지 없이 닫힌 브랜치(내용 확인이 필요해서).
# dry_run 이 true 면 지울 목록만 보여 주고 아무것도 지우지 않습니다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true 면 목록만 보여 주고 지우지 않음"
        required: false
        default: "true"
      keep:
        description: "지우지 않을 브랜치(띄어 쓰기로 여러 개)"
        required: false
        default: "main claude/otiti-bora-image-replacement-j2kjqc"

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 머지된 PR 의 브랜치 지우기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          default=$(gh api "repos/$REPO" --jq .default_branch)
          keep=" $default $KEEP "

          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' > branches.txt
          # 같은 저장소에서 온 PR 만 봅니다(포크 PR 의 같은 이름 브랜치와 헷갈리지 않게).
          gh api --paginate "repos/$REPO/pulls?state=all&per_page=100" \
            --jq ".[] | select(.head.repo.full_name == \"$REPO\") | [.head.ref, .state, (.merged_at // \"\")] | @tsv" > prs.tsv

          deleted=0; kept=0
          while read -r b; do
            if [[ "$keep" == *" $b "* ]]; then echo "남김(지정)   $b"; kept=$((kept+1)); continue; fi
            if awk -F'\t' -v b="$b" '$1==b && $2=="open"' prs.tsv | grep -q .; then
              echo "남김(열린 PR) $b"; kept=$((kept+1)); continue
            fi
            if ! awk -F'\t' -v b="$b" '$1==b && $3!=""' prs.tsv | grep -q .; then
              echo "남김(머지 PR 없음) $b"; kept=$((kept+1)); continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "지울 예정  $b"
            else
              gh api -X DELETE "repos/$REPO/git/refs/heads/$b" && echo "지움       $b"
            fi
            deleted=$((deleted+1))
          done < branches.txt

          echo
          if [ "$DRY_RUN" = "true" ]; then
            echo "미리 보기: 지울 예정 $deleted 개, 남김 $kept 개 (dry_run=false 로 다시 실행하면 지웁니다)"
          else
            echo "지움 $deleted 개, 남김 $kept 개"
          fi
