name: 콘텐츠 갱신

# KOFIC 은 전날 집계를 오전에 공개하므로 한국 시간 오전 10시에 실행합니다.
on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 10:00 KST
  push:
    branches: [main]
    paths:
      - "scripts/fetch-boxoffice.mjs"
      - "scripts/fetch-posters.mjs"
      - "scripts/fetch-tv-ranking.mjs"
      - "scripts/fetch-anime.mjs"
      - "scripts/lib/translate-synopsis.mjs"
      - "scripts/update-seo.mjs"
      - ".github/workflows/boxoffice.yml"
  workflow_dispatch: # 수동 실행
    inputs:
      days:
        description: "거슬러 올라갈 일수 (1 = 전날만, 28 = 지난 4주치 한 번에 채우기)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: boxoffice
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 출처(KOFIC·TMDB·AniList)는 서로 기대지 않습니다. 한 곳이 멈춰도
    # 나머지는 받아서 커밋하도록 뒤 단계마다 if: !cancelled() 를 둡니다.
    # 실제로 KOFIC 연결 시간 초과 하나로 애니·드라마·예능 갱신까지 통째로
    # 건너뛴 날이 있었습니다(2026-09-27). 실패한 단계가 있으면 잡은 여전히
    # 실패로 끝나므로 알림은 그대로 옵니다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 매일 도는 예약 실행은 전날 하루치만 받아 기존 목록에 더합니다.
      # 수동 실행일 때만 며칠치를 한 번에 훑습니다.
      - name: 박스오피스 내려받기
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
        run: node scripts/fetch-boxoffice.mjs --days=${{ inputs.days || '1' }}

      # 포스터 변환에만 쓰는 의존성입니다. 사이트 자체는 빌드가 없습니다.
      - name: 의존성 설치
        if: ${{ !cancelled() }}
        run: npm ci

      # KOFIC 은 포스터를 주지 않으므로 이미지는 따로 받습니다.
      # 두 키 중 등록된 쪽을 쓰고, 둘 다 없으면 건너뜁니다(실패 아님).
      - name: 포스터 내려받기
        if: ${{ !cancelled() }}
        env:
          KMDB_API_KEY: ${{ secrets.KMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-posters.mjs

      # 애니 탭은 AniList(안 되면 MyAnimeList)에서 채웁니다. 키가 필요 없습니다.
      # TMDB 키가 있으면 한국어 제목·줄거리를 찾습니다.
      # ANTHROPIC_API_KEY 가 있으면 남은 영어 제목·줄거리를 번역해
      # assets/anime-title-auto.json 과 anime-synopsis-auto.json 에 저장합니다.
      - name: 애니 내려받기
        if: ${{ !cancelled() }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-anime.mjs

      # 드라마·예능은 TMDB 한국 TV 후보를 받아 한국형 규칙으로 나눕니다.
      # 실패해도 기존 파일 또는 수동 content-data.json 이 자리를 지킵니다.
      - name: 드라마·예능 내려받기
        if: ${{ !cancelled() }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-tv-ranking.mjs

      # 제목의 기준 월, 구조화 데이터, 홈 순위 기본 마크업, sitemap.xml,
      # llms.txt 를 사이트 내용에 맞춥니다. 네트워크를 쓰지 않습니다.
      - name: 검색 태그·사이트맵 맞추기
        if: ${{ !cancelled() }}
        run: node scripts/update-seo.mjs

      - name: 변경분 커밋
        if: ${{ !cancelled() }}
        run: |
          # 경로를 하나하나 적으면 아직 없는 파일에서 git add 가 exit 128 로
          # 죽습니다(assets/anime.json). 그러면 같은 실행에서 이미 성공한
          # 포스터 작업까지 커밋되지 않습니다. 실제로 그렇게 40장을 잃었습니다.
          # 그래서 assets 는 디렉터리로 묶고, 그 밖에는 늘 있는 파일만 적습니다.
          SEO_FILES="index.html webhard.html content.html criteria.html content-detail.html sitemap.xml llms.txt"
          if [ -z "$(git status --porcelain assets $SEO_FILES)" ]; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets $SEO_FILES
          git commit -m "Update content rankings"
          git push
