name: 콘텐츠 갱신

# KOFIC 은 전날 집계를 오전에 공개하므로 한국 시간 오전 10시에 실행합니다.
on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 10:00 KST
  workflow_dispatch: # 수동 실행
    inputs:
      days:
        description: "거슬러 올라갈 일수 (1 = 전날만, 28 = 지난 4주치 한 번에 채우기)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: boxoffice
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 매일 도는 예약 실행은 전날 하루치만 받아 기존 목록에 더합니다.
      # 수동 실행일 때만 며칠치를 한 번에 훑습니다.
      - name: 박스오피스 내려받기
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
        run: node scripts/fetch-boxoffice.mjs --days=${{ inputs.days || '1' }}

      # 포스터 변환에만 쓰는 의존성입니다. 사이트 자체는 빌드가 없습니다.
      - name: 의존성 설치
        run: npm ci

      # KOFIC 은 포스터를 주지 않으므로 이미지는 따로 받습니다.
      # 두 키 중 등록된 쪽을 쓰고, 둘 다 없으면 건너뜁니다(실패 아님).
      - name: 포스터 내려받기
        env:
          KMDB_API_KEY: ${{ secrets.KMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-posters.mjs

      # 애니 탭은 MyAnimeList(Jikan)에서 채웁니다. 키가 필요 없습니다.
      # TMDB 키가 있으면 한국어 제목까지 채웁니다.
      - name: 애니 내려받기
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-anime.mjs

      - name: 변경분 커밋
        run: |
          if [ -z "$(git status --porcelain assets/boxoffice.json assets/anime.json assets/posters)" ]; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/boxoffice.json assets/anime.json assets/posters
          git commit -m "Update box office and anime"
          git push
