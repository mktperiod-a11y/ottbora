name: 콘텐츠 갱신

on:
  schedule:
    - cron: "23 2 * * *" # 02:23 UTC = 11:23 KST
    - cron: "23 10 * * *" # 10:23 UTC = 19:23 KST (오늘 이미 받았으면 건너뜀)
  push:
    branches: [main]
    paths:
      - "scripts/fetch-boxoffice.mjs"
      - "scripts/fetch-posters.mjs"
      - "scripts/fetch-tv-ranking.mjs"
      - "scripts/fetch-anime.mjs"
      - "scripts/lib/translate-synopsis.mjs"
      - "scripts/update-seo.mjs"
      - ".github/workflows/boxoffice.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "거슬러 올라갈 일수 (1 = 전날만, 28 = 지난 4주치 한 번에 채우기)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: boxoffice
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 오늘 이미 받았는지 확인
        id: check
        run: |
          yesterday=$(TZ=Asia/Seoul date -d "yesterday" +%Y%m%d)
          latest=$(node -p "require('./assets/boxoffice.json').latestDt || ''" 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$latest" = "$yesterday" ]; then
            echo "어제($yesterday) 박스오피스를 이미 받았습니다 — 이번 예약 실행은 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "받을 차례입니다 (최근 집계일: ${latest:-없음}, 받을 날: $yesterday)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 박스오피스 내려받기
        if: ${{ steps.check.outputs.skip != 'true' }}
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
        run: node scripts/fetch-boxoffice.mjs --days=${{ inputs.days || '1' }}

      - name: 의존성 설치
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: npm ci

      - name: 포스터 내려받기
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        env:
          KMDB_API_KEY: ${{ secrets.KMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-posters.mjs

      - name: 애니 내려받기
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-anime.mjs

      - name: 드라마·예능 내려받기
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-tv-ranking.mjs

      - name: 검색 태그·사이트맵 맞추기
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: node scripts/update-seo.mjs

      - name: 변경분 커밋
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' }}
        run: |
          SEO_FILES="index.html webhard.html content.html criteria.html content-detail.html sitemap.xml llms.txt"
          if [ -z "$(git status --porcelain assets $SEO_FILES)" ]; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets $SEO_FILES
          git commit -m "Update content rankings"
          git push
