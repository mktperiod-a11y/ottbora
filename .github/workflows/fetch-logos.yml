name: 공식 로고 후보 모으기

# 웹하드를 새로 넣을 때 쓰는 도구입니다.
#
# 작업 환경(샌드박스)에서는 웹하드 사이트가 막혀 있어 로고를 받을 수
# 없고, 그래서 로고를 글자로 "그려서" 채우는 일이 반복됐습니다.
# GitHub 러너는 이 사이트들에 닿으므로 여기서 받습니다.
#
# 홈페이지의 로고 후보를 모두 받아 logo-candidates/ 에 올립니다.
# 어느 것이 공식 워드마크인지는 눈으로 보고 골라 assets/ 로 옮깁니다.
#
# main 에서는 결과를 커밋하지 않고 아티팩트로만 남깁니다.
# 작업 브랜치에서 돌리면 그 브랜치에 커밋합니다.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "웹하드 id (띄어 쓰기로 여러 개, 비우면 로고가 빠진 곳 전부)"
        required: false
        default: ""
  push:
    branches-ignore: [main]
    paths:
      - scripts/fetch-logos.mjs
      - .github/workflows/fetch-logos.yml

permissions:
  contents: write

concurrency:
  group: fetch-logos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 의존성 설치
        run: npm ci

      # 인증서 사슬 중 중간 인증서를 보내지 않는 사이트가 있습니다(빅파일).
      # 브라우저는 인증서에 적힌 주소에서 빠진 중간 인증서를 받아 채우지만
      # Node 는 그러지 않아 UNABLE_TO_VERIFY_LEAF_SIGNATURE 로 실패합니다.
      #
      # 같은 일을 여기서 합니다. 인증서 검사는 끄지 않습니다. 받은 중간
      # 인증서가 (1) 시스템이 믿는 루트에서 나왔고 (2) 그 사이트의 인증서에
      # 실제로 서명했을 때만 보탭니다. 둘 중 하나라도 틀리면 버립니다.
      - name: 빠진 중간 인증서 채우기
        run: |
          extra="$RUNNER_TEMP/extra-ca.pem"
          : > "$extra"
          roots=/etc/ssl/certs/ca-certificates.crt
          for host in $(node scripts/fetch-logos.mjs --hosts ${{ github.event.inputs.ids }}); do
            # 사슬이 온전하면 건너뜁니다
            if echo | timeout 15 openssl s_client -connect "$host:443" -servername "$host" \
                 -verify_return_error -CAfile "$roots" >/dev/null 2>&1; then
              continue
            fi
            leaf="$RUNNER_TEMP/leaf.pem"; int="$RUNNER_TEMP/int.pem"
            echo | timeout 15 openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null \
              | openssl x509 -out "$leaf" 2>/dev/null || continue
            uri=$(openssl x509 -in "$leaf" -noout -ext authorityInfoAccess 2>/dev/null \
              | sed -n 's/.*CA Issuers - URI:\(.*\)/\1/p' | head -1)
            if [ -z "$uri" ]; then echo "$host: 인증서에 중간 인증서 주소가 없습니다"; continue; fi
            curl -fsS --max-time 15 "$uri" -o "$int.bin" || { echo "$host: 중간 인증서를 못 받음"; continue; }
            openssl x509 -inform DER -in "$int.bin" -out "$int" 2>/dev/null \
              || openssl x509 -in "$int.bin" -out "$int" 2>/dev/null \
              || { echo "$host: 중간 인증서 형식을 못 읽음"; continue; }
            if ! openssl verify -CAfile "$roots" "$int" >/dev/null 2>&1; then
              echo "$host: 중간 인증서가 믿는 루트에서 나오지 않음 — 보태지 않습니다"; continue
            fi
            if ! openssl verify -CAfile "$roots" -untrusted "$int" "$leaf" >/dev/null 2>&1; then
              echo "$host: 중간 인증서가 이 사이트 인증서에 서명하지 않음 — 보태지 않습니다"; continue
            fi
            cat "$int" >> "$extra"
            echo "$host: 빠진 중간 인증서를 검증 후 보탰습니다 ($uri)"
          done
          if [ -s "$extra" ]; then echo "NODE_EXTRA_CA_CERTS=$extra" >> "$GITHUB_ENV"; fi

      - name: 로고 후보 모으기
        run: node scripts/fetch-logos.mjs ${{ github.event.inputs.ids }}

      - name: 아티팩트로 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo-candidates
          path: logo-candidates
          if-no-files-found: ignore

      - name: 작업 브랜치에 커밋
        if: github.ref_name != 'main'
        run: |
          if [ ! -d logo-candidates ]; then
            echo "후보가 없습니다 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A logo-candidates
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "Collect official logo candidates"
          git push
