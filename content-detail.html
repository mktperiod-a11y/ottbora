    <script src="assets/posters-featured-20260828.js"></script>
    <script src="assets/posters-archive-20260828.js"></script>
    <script>
      const WATCH_HOSTS = new Set([
        "www.netflix.com",
        "www.disneyplus.com",
        "www.tving.com",
        "www.wavve.com",
        "www.coupangplay.com",
        "cgv.co.kr",
        "www.cgv.co.kr",
        "www.megabox.co.kr",
        "www.lottecinema.co.kr",
      ]);
      const CINEMA_HOSTS = new Set([
        "cgv.co.kr",
        "www.megabox.co.kr",
        "www.lottecinema.co.kr",
      ]);
      const OFFICIAL_HOSTS = new Set([
        "www.netflix.com",
        "www.sonypictures.com",
        "www.odysseymovie.com",
      ]);

      const WEBHARD_HOSTS = new Set([
        "ondisk.co.kr",
        "www.ondisk.co.kr",
        "kdisk.co.kr",
        "www.kdisk.co.kr",
      ]);

      const FALLBACK =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'" +
        " viewBox='0 0 2 3'%3E%3Crect width='2' height='3' fill='%23eef1f5'/%3E%3C/svg%3E";

      const BTN =
        "seed-action-button seed-action-button--variant_neutralSolid" +
        " seed-action-button--size_medium seed-action-button--layout_withText" +
        " seed-action-button--size_medium-layout_withText";

      /*
       * 목록으로 돌아갈 자리.
       *
       * 콘텐츠ZONE 은 보고 있던 탭·페이지를 주소에 적어 둡니다
       * (?tab=애니&page=2). 여기서 돌아가는 링크를 그 주소로 바꿔,
       * 카드를 눌러 들어왔다가 나가면 보던 자리로 돌아가게 합니다.
       *
       * 앞 화면이 콘텐츠ZONE 이 아니면(검색 결과로 바로 들어온 경우 등)
       * 그냥 목록 첫 화면으로 보냅니다.
       */
      (() => {
        const LIST = "content.html";
        let back = LIST;
        try {
          const ref = new URL(document.referrer || "", location.href);
          if (
            ref.origin === location.origin &&
            ref.pathname.endsWith("/" + LIST)
          ) {
            back = LIST + ref.search;
          }
        } catch {
          // 앞 화면을 알 수 없으면 기본값을 씁니다.
        }
        for (const a of document.querySelectorAll(
          `.detail-back, .site-header .menu a[href="${LIST}"]`,
        )) {
          a.setAttribute("href", back);
        }
      })();

      const id = new URLSearchParams(location.search).get("id") || "";

      const TMDB_TV_GENRE = {
        10759: "액션",
        16: "애니메이션",
        35: "코미디",
        80: "범죄",
        99: "다큐",
        18: "드라마",
        10751: "가족",
        10762: "어린이",
        9648: "미스터리",
        10763: "뉴스",
        10764: "리얼리티",
        10765: "SF·판타지",
        10766: "일일드라마",
        10767: "토크",
        10768: "시사·교양",
        37: "서부",
      };

      const safe = (raw, allow) => {
        try {
          const u = new URL(raw);
          return u.protocol === "https:" && allow.has(u.hostname) ? u.href : null;
        } catch {
          return null;
        }
      };

      const key = (t) =>
        String(t || "")
          .toLowerCase()
          .replace(/[^0-9a-z가-힣]/g, "");

      const optional = (url) =>
        fetch(url)
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);

      function prettyDate(raw) {
        const m = String(raw || "").match(/(\d{4})[-.]?(\d{2})[-.]?(\d{2})/);
        return m ? `${+m[1]}.${String(+m[2]).padStart(2, "0")}.${String(+m[3]).padStart(2, "0")}` : String(raw || "");
      }

      function audience(n) {
        if (!n) return "";
        const num = Number(n);
        return Number.isFinite(num) ? `누적 관객 ${num.toLocaleString("ko-KR")}명` : "";
      }

      function manualWork(w) {
        if (!w) return null;
        return {
          ...w,
          sourceKind: "manual",
          poster: (window.OTT_POSTERS || {})[w.id] || FALLBACK,
          meta: [w.releasedAt, w.genre, w.cast].filter(Boolean),
          detailPoints: w.points || [],
          synopsisText: w.synopsis || "줄거리 정보가 준비 중입니다.",
        };
      }

      function boxWork(m) {
        if (!m) return null;
        const points = [
          m.rank ? `현재 국내 박스오피스 ${m.rank}위` : "",
          m.bestRank ? `기간 중 최고 ${m.bestRank}위` : "",
          audience(m.audienceAcc),
        ].filter(Boolean);
        return {
          id: `kofic-${m.movieCd}`,
          sourceKind: "kofic",
          title: m.title,
          type: "영화",
          tagline: "국내 극장 흥행 데이터를 바탕으로 소개하는 작품이에요.",
          poster: m.poster || FALLBACK,
          meta: [
            prettyDate(m.openedAt),
            (m.genres || []).join(" · "),
          ].filter(Boolean),
          synopsisText: "현재 줄거리 정보를 확인할 수 없어요.",
          detailPoints: points.length ? points : ["박스오피스 자동 수집 작품"],
          watch: [],
          partner: [],
          imageCredit: m.posterCredit || "",
        };
      }

      const TMDB_STATUS_KO = {
        "Ended": "종영",
        "Returning Series": "방영 중",
        "In Production": "제작 중",
        "Planned": "공개 예정",
        "Canceled": "제작 취소",
      };

      function tvWork(w) {
        if (!w) return null;
        const genres = (w.genres || [])
          .map((g) => TMDB_TV_GENRE[g])
          .filter(Boolean);
        const points = [
          w.rank ? `인기 ${w.rank}위` : "",
          w.nextAirDate ? `다음 방송 ${prettyDate(w.nextAirDate)}` : "",
          TMDB_STATUS_KO[w.status] ? `상태 · ${TMDB_STATUS_KO[w.status]}` : "",
        ].filter(Boolean);
        return {
          id: `tmdb-${w.tmdbId}`,
          sourceKind: "tmdb",
          title: w.title,
          type: w.type || "TV",
          tagline: "현재 인기 목록에서 소개하는 작품이에요.",
          poster: w.poster || FALLBACK,
          meta: [
            w.firstAirDate ? `첫 방송 ${prettyDate(w.firstAirDate)}` : "",
            genres.join(" · "),
          ].filter(Boolean),
          synopsisText:
            w.overview || "현재 줄거리 정보를 확인할 수 없어요.",
          detailPoints: points.length ? points : ["자동 인기 목록 수록 작품"],
          watch: [],
          partner: [],
          imageCredit: w.posterCredit || "TMDB",
        };
      }

      /*
       * 제휴 웹하드에서 볼 수 있는 애니인지 봅니다.
       *
       * 제목을 공백·문장부호 뗀 형태로 맞춥니다. 작품 제목이 제휴
       * 목록의 이름을 품고 있으면 같은 작품으로 봅니다. 시즌이
       * 올라가도("… 4기") 계속 걸리게 하려는 것입니다.
       *
       * 목록은 assets/anime-partners.json 에 있습니다. 제휴가 끝나면
       * 그 줄만 지우면 버튼이 사라집니다.
       */
      let ANIME_PARTNERS = null;

      function partnerWatch(title) {
        if (!ANIME_PARTNERS) return [];
        const want = key(title);
        if (!want) return [];
        const hit = (ANIME_PARTNERS.works || []).find((w) =>
          want.includes(key(w.match)),
        );
        if (!hit) return [];
        const byId = new Map(
          (ANIME_PARTNERS.providers || []).map((x) => [x.id, x]),
        );
        return (hit.providers || [])
          .map((id) => byId.get(id))
          .filter(Boolean)
          .map((x) => ({ id: x.id, name: x.name, url: x.url }));
      }

      function animeWork(a) {
        if (!a) return null;
        const points = [
          a.score ? `${a.scoreBy || "AniList"} 평점 ${a.score}` : "",
          a.episodes ? `${a.episodes}화` : "",
          a.studio ? `제작 · ${a.studio}` : "",
          a.season ? `시즌 · ${a.season}` : "",
        ].filter(Boolean);
        return {
          id: `anime-${a.malId}`,
          sourceKind: "anime",
          title: a.title,
          type: "애니",
          tagline: "",
          poster: a.poster || FALLBACK,
          meta: [],
          animeGenres: Array.isArray(a.genres) ? a.genres.filter(Boolean) : [],
          originalTitle:
            a.titleOriginal && a.titleOriginal !== a.title
              ? a.titleOriginal
              : "",
          synopsisText: "현재 줄거리 정보를 확인할 수 없어요.",
          detailPoints: points.length ? points : ["현재 시즌 자동 수집 작품"],
          watch: [],
          partner: partnerWatch(a.title),
          imageCredit: a.posterCredit || "AniList",
        };
      }

      function resolveWork(d, box, tv, anime) {
        const manual = (d?.works || []).find((x) => x.id === id);
        if (manual) return manualWork(manual);

        if (id.startsWith("kofic-")) {
          const code = id.slice("kofic-".length);
          return boxWork((box?.movies || []).find((x) => String(x.movieCd) === code));
        }
        if (id.startsWith("tmdb-")) {
          const code = id.slice("tmdb-".length);
          const rows = [
            ...(Array.isArray(tv?.drama) ? tv.drama : []),
            ...(Array.isArray(tv?.variety) ? tv.variety : []),
          ];
          return tvWork(rows.find((x) => String(x.tmdbId) === code));
        }
        if (id.startsWith("anime-")) {
          const code = id.slice("anime-".length);
          return animeWork((anime?.works || []).find((x) => String(x.malId) === code));
        }
        return null;
      }

      /*
       * 시청 경로.
       *
       * 두 종류가 한 자리에 옵니다.
       *   바깥 OTT  넷플릭스·디즈니+ 등. 회색 버튼.
       *   제휴 웹하드 온디스크·케이디스크. 강조색 버튼.
       *
       * 라벨은 "<제공처>에서 보기" 한 가지로 맞춥니다. 어디로 가는
       * 버튼인지가 같은 말로 읽혀야 합니다. 구분은 색이 합니다.
       *
       * 제휴 링크는 우리 go/ 경로라 같은 출처입니다. 바깥 주소처럼
       * 호스트를 대조할 것이 아니라, 우리 경로가 맞는지만 봅니다.
       */
      const ownPath = (raw) =>
        /^go\/[a-z0-9-]+\/$/.test(String(raw || "")) ? raw : "";

      function watchButton(name, href, { tone = "", external = false } = {}) {
        // 제휴 버튼은 제공처마다 색이 다릅니다(content-detail.css 의
        // .watch-btn--온디스크/케이디스크). SEED 의 brandSolid 를 바탕으로
        // 깔고, 색만 덮어 씁니다.
        const cls = tone
          ? BTN.replace(
              "seed-action-button--variant_neutralSolid",
              "seed-action-button--variant_brandSolid",
            ) + ` watch-btn watch-btn--${tone}`
          : BTN;
        const rel = external
          ? ' target="_blank" rel="noopener noreferrer"'
          : "";
        return `<a class="${cls}" href="${href}"${rel}>${name}에서 보기</a>`;
      }

      function renderWatch(w) {
        const host = document.querySelector("#watch-block");
        const links = (w.watch || [])
          .map((x) => ({ ...x, href: safe(x.url, WATCH_HOSTS) }))
          .filter((x) => x.href);
        const partners = (w.partner || [])
          .map((x) => ({ ...x, href: officialWebhard(x.url) }))
          .filter((x) => x.href);

        if (!links.length && !partners.length) {
          host.innerHTML =
            '<h2>시청 경로</h2><p class="pending">현재 시청 가능한 공식 제공처를 확인할 수 없어요.</p>';
          return;
        }

        host.innerHTML =
          "<h2>시청 경로</h2>" +
          (links.length
            ? '<div class="watch-links">' +
              links
                .map((x) => watchButton(x.name, x.href, { external: true }))
                .join("") +
              "</div>"
            : "") +
          (partners.length
            ? `<div class="watch-links${links.length ? " partner-inline" : ""}">` +
              partners
                .map((x) =>
                  watchButton(x.name, x.href, { tone: x.id, external: true }),
                )
                .join("") +
              "</div>"
            : "");
      }

      const STALE_DAYS = 10;
      function isFresh(latestDt) {
        const m = String(latestDt || "").match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
        if (!m) return false;
        const then = Date.UTC(+m[1], +m[2] - 1, +m[3]);
        const now = new Date();
        const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
        const age = (today - then) / 86400000;
        return age >= 0 && age <= STALE_DAYS;
      }

      function renderBooking(w, box, cinema) {
        const host = document.querySelector("#booking-block");
        if (!host || w.type !== "영화" || !isFresh(box?.latestDt)) return;

        const now = (box?.movies || []).find(
          (m) => m.showing && key(m.title) === key(w.title),
        );
        if (!now) return;

        const override = (cinema?.movieOverrides || []).find(
          (x) =>
            String(x.movieCd || "") === String(now.movieCd || "") ||
            key(x.title) === key(now.title),
        );

        let chains = (cinema?.chains || []);
        if (override?.chainIds?.length) {
          const allowed = new Set(override.chainIds);
          chains = chains.filter((c) => allowed.has(c.id));
        }

        chains = chains
          .map((c) => {
            const direct = override?.directUrls?.[c.id];
            return {
              name: c.name,
              href: safe(direct || c.bookingUrl, CINEMA_HOSTS),
              direct: Boolean(direct),
            };
          })
          .filter((c) => c.href);
        if (!chains.length) return;

        host.innerHTML =
          "<h2>예매</h2>" +
          '<div class="watch-links">' +
          chains
            .map(
              (c) =>
                `<a class="${BTN}" href="${c.href}" target="_blank" rel="noopener noreferrer">${c.name} 예매</a>`,
            )
            .join("") +
          "</div>";
      }

      function renderMeta(w) {
        const host = document.querySelector("#meta");
        host.innerHTML = "";
        host.classList.toggle("meta--anime", w?.sourceKind === "anime");

        if (w?.sourceKind === "anime") {
          const genres = Array.isArray(w.animeGenres) ? w.animeGenres : [];
          if (genres.length) {
            const row = document.createElement("div");
            row.className = "anime-meta-line anime-meta-genres";

            const value = document.createElement("span");
            value.className = "anime-meta-value";
            value.textContent = genres.slice(0, 4).join(" · ");
            row.appendChild(value);

            if (genres.length > 4) {
              const more = document.createElement("span");
              more.className = "anime-meta-more";
              more.textContent = `+${genres.length - 4}`;
              row.appendChild(more);
            }
            host.appendChild(row);
          }

          if (w.originalTitle) {
            const row = document.createElement("div");
            row.className = "anime-meta-line anime-meta-original";

            const label = document.createElement("span");
            label.className = "anime-meta-label";
            label.textContent = "원제";

            const value = document.createElement("span");
            value.className = "anime-meta-value";
            value.textContent = w.originalTitle;

            row.append(label, value);
            host.appendChild(row);
          }
          return;
        }

        for (const text of w?.meta || []) {
          if (!text) continue;
          const span = document.createElement("span");
          span.textContent = text;
          host.appendChild(span);
        }
      }

      function renderPoints(points) {
        const ul = document.querySelector("#points");
        ul.innerHTML = "";
        for (const text of points || []) {
          const li = document.createElement("li");
          li.textContent = text;
          ul.appendChild(li);
        }
      }

      Promise.all([
        fetch("assets/content-data.json").then((r) => r.json()),
        optional("assets/boxoffice.json"),
        optional("assets/cinema-links.json"),
        optional("assets/tv-ranking.json"),
        optional("assets/anime.json"),
        optional("assets/anime-partners.json"),
      ])
        .then(([d, box, cinema, tv, anime, partners]) => {
          // resolveWork 안에서 쓰므로 작품을 찾기 전에 먼저 담아 둡니다.
          ANIME_PARTNERS = partners;
          const w = resolveWork(d, box, tv, anime);
          if (!w) {
            document.querySelector("#title").textContent = "작품 정보를 찾지 못했습니다.";
            document.querySelector("#tagline").textContent =
              "목록으로 돌아가 다른 작품을 선택해 주세요.";
            document.querySelector("#poster").src = FALLBACK;
            document.querySelector(".copy").hidden = true;
            return;
          }

          document.title = w.title + " | 콘텐츠ZONE - 오티티보라";
          const img = document.querySelector("#poster");
          img.src = w.poster || FALLBACK;
          img.alt = w.title + " 포스터";
          img.onerror = () => {
            img.onerror = null;
            img.src = FALLBACK;
          };

          document.querySelector("#category").textContent = w.type + " CONTENT";
          document.querySelector("#title").textContent = w.title;
          document.querySelector("#tagline").textContent = w.tagline || "";
          renderMeta(w);
          document.querySelector("#synopsis").textContent = w.synopsisText || "";
          document.querySelector("#points-title").textContent =
            w.sourceKind === "manual" ? "관전 포인트" : "작품 정보";
          renderPoints(w.detailPoints || []);

          renderWatch(w);
          renderBooking(w, box, cinema);

          const off = w.official && safe(w.official.url, OFFICIAL_HOSTS);
          if (off) {
            const a = document.createElement("a");
            a.className = "official-link";
            a.href = off;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = w.official.label || "공식 작품 정보 보기 →";
            document.querySelector("#official-action").appendChild(a);
          }

          if (w.imageCredit) {
            document.querySelector("#credit").textContent =
              "이미지 출처 · " + w.imageCredit;
          }
        })
        .catch(() => {
          document.querySelector("#title").textContent =
            "작품 정보를 불러오지 못했습니다.";
        });
    </script>
  </body>
</html>
