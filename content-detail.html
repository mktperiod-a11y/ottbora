<!doctype html>
<html lang="ko" data-seed-color-mode="light-only">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>콘텐츠 상세 | 오티티보라</title>
    <meta
      name="description"
      content="작품 줄거리, 출연진과 관전 포인트를 확인하세요."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="stylesheet" href="assets/fonts/gmarketsans/gmarketsans.css" />
    <link
      rel="stylesheet"
      href="assets/fonts/pretendard/pretendardvariable-dynamic-subset.css"
    />
    <link rel="stylesheet" href="assets/seed/seed.css" />
    <link rel="stylesheet" href="assets/seed-theme.css" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/content-detail.css" />
  </head>
  <body>
    <a class="skip" href="#main">본문으로 바로가기</a>
    <header class="site-header">
      <nav class="wrap nav" aria-label="주요 메뉴">
        <a class="logo" href="index.html"
          ><i aria-hidden="true">▶</i>오티티<span>보라</span></a
        >
        <div class="menu">
          <a href="webhard.html">웹하드 순위</a
          ><a class="on" aria-current="page" href="content.html">콘텐츠ZONE</a
          ><a href="criteria.html">이용 가이드</a>
        </div>
      </nav>
    </header>
    <main class="wrap" id="main">
      <div class="detail">
        <img class="detail-poster" id="poster" alt="" />
        <section>
          <span class="ey" id="category"></span>
          <h1 id="title"></h1>
          <p class="sub" id="tagline"></p>
          <div class="meta" id="meta"></div>
          <div class="copy">
            <h2>줄거리</h2>
            <p id="synopsis"></p>
            <h2>관전 포인트</h2>
            <ul id="points"></ul>
            <div id="watch-block"></div>
            <div id="booking-block"></div>
            <div id="official-action"></div>
            <p class="credit" id="credit"></p>
          </div>
        </section>
      </div>
    </main>
    <footer>
      <div class="wrap footer-row">
        <p>© 2026 OTT BORA</p>
      </div>
    </footer>
    <script src="assets/posters-featured-20260828.js"></script>
    <script src="assets/posters-archive-20260828.js"></script>
    <script>
      // 링크를 걸 수 있는 호스트를 명시적으로 제한합니다.
      // 데이터에 어떤 URL 이 들어오든, 여기 없는 호스트는 링크가 되지 않습니다.
      const WATCH_HOSTS = new Set([
        "www.netflix.com",
        "www.disneyplus.com",
        "www.tving.com",
        "www.wavve.com",
        "www.coupangplay.com",
        "cgv.co.kr",
        "www.cgv.co.kr",
        "www.megabox.co.kr",
        "www.lottecinema.co.kr",
      ]);
      // 극장 예매 링크는 별도 목록으로 둡니다. 시청 경로(OTT)와 성격이
      // 다르고, 지금 극장에 걸려 있을 때만 나타납니다.
      const CINEMA_HOSTS = new Set([
        "cgv.co.kr",
        "www.megabox.co.kr",
        "www.lottecinema.co.kr",
      ]);

      const OFFICIAL_HOSTS = new Set([
        "www.netflix.com",
        "www.sonypictures.com",
        "www.odysseymovie.com",
      ]);

      const safe = (raw, allow) => {
        try {
          const u = new URL(raw);
          return u.protocol === "https:" && allow.has(u.hostname) ? u.href : null;
        } catch {
          return null;
        }
      };

      const FALLBACK =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'" +
        " viewBox='0 0 2 3'%3E%3Crect width='2' height='3' fill='%23eef1f5'/%3E%3C/svg%3E";

      const BTN =
        "seed-action-button seed-action-button--variant_neutralSolid" +
        " seed-action-button--size_medium seed-action-button--layout_withText" +
        " seed-action-button--size_medium-layout_withText";

      const id = new URLSearchParams(location.search).get("id") || "";

      function renderWatch(w) {
        const host = document.querySelector("#watch-block");
        const links = (w.watch || [])
          .map((x) => ({ ...x, href: safe(x.url, WATCH_HOSTS) }))
          .filter((x) => x.href);

        if (!links.length) {
          // 확인되지 않은 경로를 추측해서 채우지 않습니다.
          host.innerHTML =
            '<h2>시청 경로</h2><p class="pending">공식 제공처를 확인하는 중입니다.</p>';
          return;
        }
        host.innerHTML =
          "<h2>시청 경로</h2>" +
          '<div class="watch-links">' +
          links
            .map(
              (x) =>
                `<a class="${BTN}" href="${x.href}" target="_blank"` +
                ' rel="noopener noreferrer">' +
                `${x.name}에서 보기</a>`,
            )
            .join("") +
          "</div>" +
          // 제휴 웹하드는 해당 작품의 제공이 확인된 경우에만 나타납니다.
          ((w.partner || []).length
            ? '<div class="watch-links partner-inline">' +
              w.partner
                .map(
                  (pn) =>
                    `<a class="${BTN}" href="${pn.url}">${pn.name}</a>`,
                )
                .join("") +
              "</div>"
            : "");
      }

      /** 제목 비교용. 공백과 문장부호를 떼고 맞춥니다. */
      const key = (t) =>
        String(t || "")
          .toLowerCase()
          .replace(/[^0-9a-z가-힣]/g, "");

      /**
       * 박스오피스 집계가 오래되면 예매를 권하지 않습니다.
       * 갱신이 멈춘 채로 두면 이미 내려간 영화에 예매 링크가 계속
       * 붙게 되는데, 그건 사실이 아닌 안내가 됩니다.
       */
      const STALE_DAYS = 10;
      function isFresh(latestDt) {
        const m = String(latestDt || "").match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
        if (!m) return false;
        const then = Date.UTC(+m[1], +m[2] - 1, +m[3]);
        const now = new Date();
        const today = Date.UTC(
          now.getUTCFullYear(),
          now.getUTCMonth(),
          now.getUTCDate(),
        );
        const age = (today - then) / 86400000;
        return age >= 0 && age <= STALE_DAYS;
      }

      /*
       * 지금 극장에 걸려 있는 작품이면 예매처를 답니다.
       *
       * 전에는 목록 카드마다 예매 칩 세 개가 붙어 있었습니다. 카드가
       * 스무 장이면 예매 칩이 예순 개라, 정작 무슨 작품인지가 안 보였습니다.
       * 예매는 "이 작품을 보기로 한 다음" 의 행동이므로 상세 페이지로
       * 옮깁니다.
       *
       * 상영 여부는 KOFIC 박스오피스의 showing 을 그대로 씁니다.
       * 우리가 짐작하지 않습니다.
       */
      function renderBooking(w, box, cinema) {
        const host = document.querySelector("#booking-block");
        if (!host) return;
        if (w.type !== "영화" || !isFresh(box?.latestDt)) return;

        const now = (box?.movies || []).find(
          (m) => m.showing && key(m.title) === key(w.title),
        );
        if (!now) return;

        const chains = (cinema?.chains || [])
          .map((c) => ({ name: c.name, href: safe(c.bookingUrl, CINEMA_HOSTS) }))
          .filter((c) => c.href);
        if (!chains.length) return;

        host.innerHTML =
          "<h2>예매</h2>" +
          '<div class="watch-links">' +
          chains
            .map(
              (c) =>
                `<a class="${BTN}" href="${c.href}" target="_blank"` +
                ' rel="noopener noreferrer">' +
                `${c.name} 예매</a>`,
            )
            .join("") +
          "</div>";
      }

      /** 부가 데이터는 없어도 페이지가 뜨도록 따로 받습니다. */
      const optional = (url) =>
        fetch(url)
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);

      Promise.all([
        fetch("assets/content-data.json").then((r) => r.json()),
        optional("assets/boxoffice.json"),
        optional("assets/cinema-links.json"),
      ])
        .then(([d, box, cinema]) => {
          const w = d.works.find((x) => x.id === id) || d.works[0];
          document.title = w.title + " | 콘텐츠ZONE - 오티티보라";
          const img = document.querySelector("#poster");
          img.src = (window.OTT_POSTERS || {})[w.id] || FALLBACK;
          img.alt = w.title + " 포스터";
          img.onerror = () => {
            img.onerror = null;
            img.src = FALLBACK;
          };
          document.querySelector("#category").textContent = w.type + " CONTENT";
          document.querySelector("#title").textContent = w.title;
          document.querySelector("#tagline").textContent = w.tagline;
          document.querySelector("#meta").innerHTML = [
            w.releasedAt,
            w.genre,
            w.cast,
          ]
            .filter(Boolean)
            .map((x) => "<span></span>")
            .join("");
          document
            .querySelectorAll("#meta span")
            .forEach((el, i) => {
              el.textContent = [w.releasedAt, w.genre, w.cast].filter(Boolean)[i];
            });
          document.querySelector("#synopsis").textContent = w.synopsis;
          const ul = document.querySelector("#points");
          (w.points || []).forEach((t) => {
            const li = document.createElement("li");
            li.textContent = t;
            ul.appendChild(li);
          });

          renderWatch(w);
          renderBooking(w, box, cinema);

          const off = w.official && safe(w.official.url, OFFICIAL_HOSTS);
          if (off) {
            const a = document.createElement("a");
            a.className = "official-link";
            a.href = off;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = w.official.label || "공식 작품 정보 보기 →";
            document.querySelector("#official-action").appendChild(a);
          }
          if (w.imageCredit) {
            document.querySelector("#credit").textContent =
              "이미지 출처 · " + w.imageCredit;
          }
        })
        .catch(() => {
          document.querySelector("#title").textContent =
            "작품 정보를 불러오지 못했습니다.";
        });
    </script>
  </body>
</html>
