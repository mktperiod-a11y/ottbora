    <script>
      const CINEMA_HOSTS = new Set([
        "cgv.co.kr",
        "www.megabox.co.kr",
        "www.lottecinema.co.kr",
      ]);
      const OFFICIAL_HOSTS = new Set([
        "www.netflix.com",
        "www.sonypictures.com",
        "www.odysseymovie.com",
      ]);

      const FALLBACK =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'" +
        " viewBox='0 0 2 3'%3E%3Crect width='2' height='3' fill='%23eef1f5'/%3E%3C/svg%3E";

      const BTN =
        "seed-action-button seed-action-button--variant_neutralSolid" +
        " seed-action-button--size_medium seed-action-button--layout_withText" +
        " seed-action-button--size_medium-layout_withText";

      /*
       * 목록으로 돌아갈 자리.
       *
       * 콘텐츠ZONE 은 보고 있던 탭·페이지를 주소에 적어 둡니다
       * (?tab=애니&page=2). 여기서 돌아가는 링크를 그 주소로 바꿔,
       * 카드를 눌러 들어왔다가 나가면 보던 자리로 돌아가게 합니다.
       *
       * 앞 화면이 콘텐츠ZONE 이 아니면(검색 결과로 바로 들어온 경우 등)
       * 그냥 목록 첫 화면으로 보냅니다.
       */
      (() => {
        const LIST = "content.html";
        let back = LIST;
        try {
          const ref = new URL(document.referrer || "", location.href);
          if (
            ref.origin === location.origin &&
            ref.pathname.endsWith("/" + LIST)
          ) {
            back = LIST + ref.search;
          }
        } catch {
          // 앞 화면을 알 수 없으면 기본값을 씁니다.
        }
        for (const a of document.querySelectorAll(
          `.detail-back, .site-header .menu a[href="${LIST}"]`,
        )) {
          a.setAttribute("href", back);
        }
      })();

      const id = new URLSearchParams(location.search).get("id") || "";

      const TMDB_TV_GENRE = {
        10759: "액션",
        16: "애니메이션",
        35: "코미디",
        80: "범죄",
        99: "다큐",
        18: "드라마",
        10751: "가족",
        10762: "어린이",
        9648: "미스터리",
        10763: "뉴스",
        10764: "리얼리티",
        10765: "SF·판타지",
        10766: "일일드라마",
        10767: "토크",
        10768: "시사·교양",
        37: "서부",
      };

      const safe = (raw, allow) => {
        try {
          const u = new URL(raw);
          return u.protocol === "https:" && allow.has(u.hostname) ? u.href : null;
        } catch {
          return null;
        }
      };

      const key = (t) =>
        String(t || "")
          .toLowerCase()
          .replace(/[^0-9a-z가-힣]/g, "");

      const optional = (url) =>
        fetch(url)
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);

      function prettyDate(raw) {
        const m = String(raw || "").match(/(\d{4})[-.]?(\d{2})[-.]?(\d{2})/);
        return m ? `${+m[1]}.${String(+m[2]).padStart(2, "0")}.${String(+m[3]).padStart(2, "0")}` : String(raw || "");
      }

      function audience(n) {
        if (!n) return "";
        const num = Number(n);
        return Number.isFinite(num) ? `누적 관객 ${num.toLocaleString("ko-KR")}명` : "";
      }

      function timeMeta(type, raw) {
        if (!raw) return "";
        const value = prettyDate(raw);
        if (type === "영화") return `개봉 ${value}`;
        if (type === "드라마" || type === "예능") return `첫 방송 ${value}`;
        return value;
      }

      function matchingBoxMovie(w, box, archive) {
        if (w?.type !== "영화") return null;
        const release = String(w.releasedAt || "").match(/\d{4}[-.]\d{2}[-.]\d{2}/)?.[0];
        return [...(box?.movies || []), ...(archive?.movies || [])].find((m) =>
          key(m.title) === key(w.title) &&
          (!release || prettyDate(m.openedAt) === prettyDate(release)),
        ) || null;
      }

      function manualWork(w, box, archive) {
        if (!w) return null;
        const movie = matchingBoxMovie(w, box, archive);
        const movieFacts = w.type === "영화" ? filmFacts(movie, box?.latestDt) : [];
        if (w.type === "영화") {
          const fallback = [
            fact("상영시간", w.runtime ? `${w.runtime}분` : ""),
            fact("관람등급", w.rating),
            fact("감독", w.director || (w.cast?.startsWith("감독 ") ? w.cast.replace(/^감독\s+/, "") : "")),
            fact("출연", w.cast?.startsWith("감독 ") ? "" : w.cast),
            fact("제작", w.production),
            fact("배급", w.distribution),
          ].filter(Boolean);
          for (const item of fallback) {
            if (!movieFacts.some((x) => x.label === item.label)) movieFacts.push(item);
          }
        }
        return {
          ...w,
          sourceKind: "manual",
          poster: (window.OTT_POSTERS || {})[w.id] || FALLBACK,
          meta: [timeMeta(w.type, w.releasedAt), w.genre].filter(Boolean),
          detailPoints: w.type === "영화" ? movieFacts : manualFacts(w),
          synopsisText: (w.synopsisCredit ? w.synopsis : movie?.synopsis || w.synopsis) || "현재 줄거리 정보를 확인할 수 없어요.",
          synopsisCredit: w.synopsisCredit || (movie?.synopsis ? movie.synopsisCredit || "" : ""),
        };
      }

      function fact(label, value) {
        return value ? { label, value: String(value) } : null;
      }

      function manualFacts(w) {
        const weekly = w.pickedBy === "주간 톱10"
          ? String(w.tagline || "").match(/^(.+?) 글로벌 비영어 시리즈 (\d+)위$/)
          : null;
        const views = w.pickedBy === "주간 톱10"
          ? (w.points || []).find((x) => /^해당 주간 조회수\s/.test(x))
          : "";
        return [
          fact("글로벌 비영어 시리즈 순위", weekly ? `${weekly[2]}위` : ""),
          fact("집계 기간", weekly?.[1]),
          fact("주간 조회수", views ? views.replace(/^해당 주간 조회수\s*/, "") : ""),
          fact("출연", w.cast),
          fact(w.type === "영화" ? "개봉" : "첫 방송", w.releasedAt ? prettyDate(w.releasedAt) : ""),
          fact("장르", w.genre),
        ].filter(Boolean);
      }

      function shortPeople(list, max = 4) {
        const rows = Array.isArray(list) ? list.filter(Boolean) : [];
        if (!rows.length) return "";
        return rows.slice(0, max).join(" · ") + (rows.length > max ? ` +${rows.length - max}` : "");
      }

      // KOBIS의 법인명은 원본 데이터에 두고, 상세 화면에서만 짧게 표기합니다.
      function displayCompany(name) {
        if (String(name || "").replace(/\s/g, "") ===
            "소니픽쳐스엔터테인먼트코리아주식회사극장배급지점") {
          return "소니픽쳐스";
        }
        // 괄호 속 약칭이 있으면 그걸로: (주)넥스트엔터테인먼트월드(NEW) → NEW
        const abbr = String(name || "").match(/\(([A-Z0-9&]{2,})\)\s*$/);
        if (abbr) return abbr[1];
        // 법인 표기는 빼고: 앤솔로지스튜디오(주) → 앤솔로지스튜디오
        return String(name || "")
          .replace(/\((주|유|사|재)\)|㈜|주식회사|유한회사/g, "")
          .replace(/\s{2,}/g, " ")
          .trim();
      }

      function shortCompanies(list) {
        return shortPeople((list || []).map(displayCompany), 2);
      }

      function filmFacts(m, latestDt) {
        if (!m) return [];
        const audienceText = audience(m.audienceAcc).replace(/^누적 관객\s*/, "");
        // 기준일은 값 쪽에 짧게 붙여 항목 이름이 한 줄에 들어가게 합니다.
        const [, mm, dd] = prettyDate(latestDt).split(".");
        const rankDate = latestDt && dd ? ` · ${+mm}.${+dd} 기준` : "";
        return [
          fact("박스오피스 순위", m.rank ? `${m.rank}위${rankDate}` : ""),
          fact("TMDB 평점", Number(m.score) > 0 ? `${m.score} / 10` : ""),
          fact("상영시간", m.runtime ? `${m.runtime}분` : ""),
          fact("관람등급", m.rating),
          fact("누적 관객", audienceText),
          fact("감독", shortPeople(m.directors, 2)),
          fact("출연", shortPeople(m.cast, 3)),
          fact("제작", shortCompanies(m.producers)),
          fact("배급", shortCompanies(m.distributors)),
        ].filter(Boolean);
      }

      function boxWork(m, latestDt) {
        if (!m) return null;
        const facts = filmFacts(m, latestDt);

        return {
          id: `kofic-${m.movieCd}`,
          sourceKind: "kofic",
          title: m.title,
          type: "영화",
          tagline: "",
          poster: m.poster || FALLBACK,
          meta: [
            m.openedAt ? `개봉 ${prettyDate(m.openedAt)}` : "",
            (m.genres || []).join(" · "),
          ].filter(Boolean),
          synopsisText: m.synopsis || "현재 줄거리 정보를 확인할 수 없어요.",
          synopsisCredit: m.synopsis ? m.synopsisCredit || "" : "",
          detailPoints: facts,
          imageCredit: m.posterCredit || "",
        };
      }

      const TMDB_STATUS_KO = {
        "Ended": "종영",
        "Returning Series": "방영 중",
        "In Production": "제작 중",
        "Planned": "공개 예정",
        "Canceled": "제작 취소",
      };

      function tvWork(w) {
        if (!w) return null;
        const genres = (w.genres || [])
          .map((g) => TMDB_TV_GENRE[g])
          .filter(Boolean);
        const facts = [
          fact("인기 순위", w.rank && w.rank <= 20 ? `${w.rank}위` : ""),
          fact("TMDB 평점", Number(w.score) > 0 ? `${w.score} / 10` : ""),
          fact("회차", w.episodes ? `${w.episodes}화` : ""),
          fact("회당", w.runtime ? `약 ${w.runtime}분` : ""),
          fact("방송사", shortPeople(w.networks, 3)),
          fact("제작", shortPeople(w.creators, 3)),
          fact("다음 방송", w.nextAirDate ? prettyDate(w.nextAirDate) : ""),
          fact("상태", TMDB_STATUS_KO[w.status] || ""),
        ].filter(Boolean);

        return {
          id: `tmdb-${w.tmdbId}`,
          sourceKind: "tmdb",
          title: w.title,
          type: w.type || "TV",
          tagline: "",
          poster: w.poster || FALLBACK,
          meta: [
            w.firstAirDate ? `첫 방송 ${prettyDate(w.firstAirDate)}` : "",
            genres.join(" · "),
          ].filter(Boolean),
          synopsisText:
            w.overview || "현재 줄거리 정보를 확인할 수 없어요.",
          synopsisCredit: w.overview ? "TMDB" : "",
          detailPoints: facts,
          imageCredit: w.posterCredit || "TMDB",
        };
      }

      function animeSeasonLabel(raw) {
        const m = String(raw || "").trim().match(/^(\d{4})\s+(spring|summer|fall|winter)$/i);
        if (!m) return "";
        const seasonKo = {
          spring: "봄",
          summer: "여름",
          fall: "가을",
          winter: "겨울",
        };
        return `${m[1]}년 ${seasonKo[m[2].toLowerCase()] || ""} 방영`.trim();
      }

      /*
       * 애니 줄거리의 출처. 한국어가 없어 원문을 그대로 싣거나 원문을
       * 옮긴 경우 그렇다는 것을 밝힙니다(scripts/fetch-anime.mjs 참고).
       */
      function animeSynopsisCredit(a) {
        const by = a.synopsisBy || "";
        if (!by) return "";
        if (a.synopsisTranslated) return `${by} 원문 번역`;
        if (a.synopsisLang === "en") return `${by} 영어 원문`;
        return by;
      }

      function animeWork(a) {
        if (!a) return null;

        const seasonLabel = animeSeasonLabel(a.season);
        const genres = Array.isArray(a.genres) ? a.genres.filter(Boolean) : [];
        const shownGenres = genres.slice(0, 3).join(" · ");
        const genreMeta = shownGenres
          ? `${shownGenres}${genres.length > 3 ? ` +${genres.length - 3}` : ""}`
          : "";

        const originalTitle =
          a.titleOriginal && a.titleOriginal !== a.title
            ? `원제 · ${a.titleOriginal}`
            : "";

        const points = [
          fact("평점", a.score ? `${a.score} / 10 · ${a.scoreBy || "AniList"}` : ""),
          fact("회차", a.episodes ? `${a.episodes}화` : ""),
          fact("제작", a.studio),
          fact("원제", originalTitle.replace(/^원제 · /, "")),
        ].filter(Boolean);

        return {
          id: `anime-${a.malId}`,
          sourceKind: "anime",
          title: a.title,
          type: "애니",
          tagline: "",
          poster: a.poster || FALLBACK,
          meta: [seasonLabel, genreMeta].filter(Boolean),
          synopsisText: a.synopsis || "현재 줄거리 정보를 확인할 수 없어요.",
          synopsisLang: a.synopsis ? a.synopsisLang || "" : "",
          synopsisCredit: a.synopsis ? animeSynopsisCredit(a) : "",
          detailPoints: points,
          imageCredit: a.posterCredit || "AniList",
        };
      }

      function resolveWork(d, box, tv, anime, archive) {
        const manual = (d?.works || []).find((x) => x.id === id);
        if (manual) return manualWork(manual, box, archive);

        if (id.startsWith("kofic-")) {
          const code = id.slice("kofic-".length);
          return boxWork([...(box?.movies || []), ...(archive?.movies || [])]
            .find((x) => String(x.movieCd) === code), box?.latestDt);
        }
        if (id.startsWith("tmdb-")) {
          const code = id.slice("tmdb-".length);
          const rows = [
            ...(Array.isArray(tv?.drama) ? tv.drama : []),
            ...(Array.isArray(tv?.variety) ? tv.variety : []),
          ];
          return tvWork(rows.find((x) => String(x.tmdbId) === code));
        }
        if (id.startsWith("anime-")) {
          const code = id.slice("anime-".length);
          return animeWork((anime?.works || []).find((x) => String(x.malId) === code));
        }
        return null;
      }

      const STALE_DAYS = 10;
      function isFresh(latestDt) {
        const m = String(latestDt || "").match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
        if (!m) return false;
        const then = Date.UTC(+m[1], +m[2] - 1, +m[3]);
        const now = new Date();
        const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
        const age = (today - then) / 86400000;
        return age >= 0 && age <= STALE_DAYS;
      }

      function renderBooking(w, box, cinema) {
        const host = document.querySelector("#booking-block");
        if (!host || w.type !== "영화" || !isFresh(box?.latestDt)) return;

        const now = (box?.movies || []).find(
          (m) => m.showing && key(m.title) === key(w.title),
        );
        if (!now) return;

        const override = (cinema?.movieOverrides || []).find(
          (x) =>
            String(x.movieCd || "") === String(now.movieCd || "") ||
            key(x.title) === key(now.title),
        );

        let chains = (cinema?.chains || []);
        if (override?.chainIds?.length) {
          const allowed = new Set(override.chainIds);
          chains = chains.filter((c) => allowed.has(c.id));
        }

        chains = chains
          .map((c) => {
            const direct = override?.directUrls?.[c.id];
            return {
              id: /^[a-z]+$/.test(c.id || "") ? c.id : "",
              color: /^#[0-9a-f]{6}$/i.test(c.color || "") ? c.color : "",
              name: c.name,
              // 공식 로고 파일명만 받습니다(경로·주소가 섞이면 쓰지 않음).
              logo: /^[\w.-]+\.(png|svg|webp)$/.test(c.logo || "") ? `assets/${c.logo}` : "",
              href: safe(direct || c.bookingUrl, CINEMA_HOSTS),
              direct: Boolean(direct),
            };
          })
          .filter((c) => c.href);
        if (!chains.length) return;

        // 극장마다 같은 크기의 타일에 공식 로고와 그 옆 극장 이름을 둡니다.
        // "예매" 는 제목이 말하므로 타일 안에는 쓰지 않습니다.
        host.innerHTML =
          "<h2>예매</h2>" +
          `<div class="cinema-tiles" style="--n:${chains.length}">` +
          chains
            .map(
              (c) =>
                `<a class="cinema-tile" href="${c.href}" target="_blank" rel="noopener noreferrer"` +
                (c.color ? ` style="--brand:${c.color}"` : "") +
                ` aria-label="${c.name} 예매, 새 창에서 열기">` +
                (c.logo
                  ? `<span class="cinema-mark"><img class="cinema-logo cinema-logo--${c.id}" src="${c.logo}" alt="" aria-hidden="true" /></span>`
                  : "") +
                `<span class="cinema-name">${c.name}</span>` +
                `<span class="cinema-go" aria-hidden="true">↗</span></a>`,
            )
            .join("") +
          "</div>";
      }

      function renderMeta(w) {
        const host = document.querySelector("#meta");
        host.innerHTML = "";
        for (const text of w?.meta || []) {
          if (!text) continue;
          const span = document.createElement("span");
          span.textContent = text;
          host.appendChild(span);
        }
      }

      function renderPoints(points) {
        const ul = document.querySelector("#points");
        ul.innerHTML = "";
        const rows = points || [];
        ul.classList.toggle(
          "fact-grid",
          rows.some((item) => item && typeof item === "object"),
        );

        for (const item of rows) {
          const li = document.createElement("li");
          if (item && typeof item === "object") {
            // 모바일 두 칸에서 값이 길면(출연·원제 등) 한 줄을 통째로 씁니다.
            const long = /^(출연|원제)$/.test(item.label || "") || String(item.value || "").length > 11;
            li.className = long ? "fact-item fact-item--wide" : "fact-item";
            const label = document.createElement("span");
            label.className = "fact-label";
            label.textContent = item.label || "";
            const value = document.createElement("strong");
            value.className = "fact-value";
            value.textContent = item.value || "";
            li.append(label, value);
          } else {
            li.textContent = item;
          }
          ul.appendChild(li);
        }
      }

      /*
       * 검색엔진은 스크립트를 실행한 뒤의 설명·대표 주소를 읽습니다.
       * 작품마다 바꿔 주지 않으면 상세 페이지가 모두 같은 문서로 보입니다.
       * 정적 HTML 에는 canonical 을 두지 않습니다(여기서만 정합니다).
       */
      function applySeo(w) {
        const url =
          "https://mktperiod-a11y.github.io/ottbora/content-detail.html?id=" +
          encodeURIComponent(id);
        const about = String(w.synopsisText || w.tagline || "")
          .replace(/\s+/g, " ")
          .trim();
        const text = about
          ? `${w.title} 줄거리 — ${about}`
          : `${w.title}의 줄거리와 작품 정보를 확인하세요.`;
        const description = text.length > 150 ? text.slice(0, 149) + "…" : text;

        const meta = (key, value, attr = "name") => {
          let el = document.head.querySelector(`meta[${attr}="${key}"]`);
          if (!el) {
            el = document.head.appendChild(document.createElement("meta"));
            el.setAttribute(attr, key);
          }
          el.content = value;
        };
        meta("description", description);
        meta("og:title", document.title, "property");
        meta("og:description", description, "property");
        meta("og:url", url, "property");

        const link =
          document.head.querySelector('link[rel="canonical"]') ||
          document.head.appendChild(document.createElement("link"));
        link.rel = "canonical";
        link.href = url;
      }

      Promise.all([
        fetch("assets/content-data.json?v=20260929-3").then((r) => r.json()),
        optional("assets/boxoffice.json"),
        optional("assets/cinema-links.json"),
        optional("assets/tv-ranking.json"),
        optional("assets/anime.json"),
        optional("assets/movie-archive.json?v=20260928-2"),
      ])
        .then(([d, box, cinema, tv, anime, archive]) => {
          const w = resolveWork(d, box, tv, anime, archive);
          if (!w) {
            // 없는 작품 주소가 검색 결과에 남지 않게 합니다.
            document.querySelector('meta[name="robots"]').content = "noindex,follow";
            document.querySelector("#title").textContent = "작품 정보를 찾지 못했습니다.";
            document.querySelector("#tagline").textContent =
              "목록으로 돌아가 다른 작품을 선택해 주세요.";
            document.querySelector("#poster").src = FALLBACK;
            document.querySelector(".copy").hidden = true;
            return;
          }

          document.title = w.title + " | 콘텐츠ZONE - 오티티보라";
          applySeo(w);
          const img = document.querySelector("#poster");
          img.src = w.poster || FALLBACK;
          img.alt = w.title + " 포스터";
          img.onerror = () => {
            img.onerror = null;
            img.src = FALLBACK;
          };

          document.querySelector("#category").textContent = w.type + " CONTENT";
          document.querySelector("#title").textContent = w.title;
          document.querySelector("#tagline").textContent = w.tagline || "";
          renderMeta(w);
          const synopsisEl = document.querySelector("#synopsis");
          synopsisEl.textContent = w.synopsisText || "";
          if (w.synopsisLang) synopsisEl.lang = w.synopsisLang;
          document.querySelector("#points-title").textContent = "작품 정보";
          renderPoints(w.detailPoints || []);
          document.querySelector("#points-title").hidden = !(w.detailPoints || []).length;

          renderBooking(w, box, cinema);

          const off = w.official && safe(w.official.url, OFFICIAL_HOSTS);
          if (off) {
            const a = document.createElement("a");
            a.className = "official-link";
            a.href = off;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = w.official.label || "공식 작품 정보 보기 →";
            document.querySelector("#official-action").appendChild(a);
          }

          const credits = [
            w.imageCredit ? "이미지 출처 · " + w.imageCredit : "",
            w.synopsisCredit ? "줄거리 출처 · " + w.synopsisCredit : "",
          ].filter(Boolean);
          if (credits.length) {
            document.querySelector("#credit").textContent = credits.join(" / ");
          }
        })
        .catch(() => {
          document.querySelector("#title").textContent =
            "작품 정보를 불러오지 못했습니다.";
        });
    </script>
    <script src="assets/webhard-ranking.js?v=20260929-2"></script>
    <script>
      /*
       * 제휴 배너. 들어올 때마다 하나를 골라 띄웁니다.
       *
       *   온디스크 35% · 케이디스크 30%
       *   나머지 35% 는 이번 주 웹하드 순위(TOP 10)에 올라온 다른 곳끼리 똑같이 나눕니다.
       *
       * OTHERS 에는 순위 후보 전체(예비 포함) 배너를 보관해 두고,
       * 그 주 TOP 10 에 든 곳만 뽑힙니다. 이름·주소는 랭킹 엔진
       * (assets/webhard-ranking.js)에서 가져오고, 여기서는 색과 문구만 적습니다.
       * 로고는 여백을 깎아 둔 assets/promo/<id>.png 를 쓰고, 가로세로 비율에
       * 맞춰 눈에 보이는 면적이 같아지도록 크기를 정합니다(--k).
       * 글자가 유난히 굵어 커 보이는 로고는 scale 로 조금 줄입니다.
       * deco 는 배경 장식 모양입니다(기본 lines: 점 격자 + 사선 띠).
       *   rings 겹친 두 원 · squares 비스듬한 네모 · blob 옅은 큰 원
       *   stripes 사선 줄무늬 · triangle 모서리 삼각형
       * 사이트 본문과 구분되도록 각 서비스 색을 쓰고 "제휴" 표시를 붙입니다.
       */
      (() => {
        const host = document.querySelector("#promo");
        if (!host) return;
        const MAIN = [
          {
            id: "ondisk",
            weight: 35,
            name: "온디스크",
            logo: "assets/promo/ondisk.png",
            url: "go/ondisk/",
            title: "오늘 뭐 볼지, <br /><em>고민 끝</em>",
            titleMobile: "뭐 볼지 고민된다면, <em>온디스크</em>",
            text: "영화·드라마·애니까지 한 번에",
          },
          {
            id: "kdisk",
            weight: 30,
            name: "케이디스크",
            logo: "assets/promo/kdisk.png",
            url: "go/kdisk/",
            color: "#5c9608",
            deco: "rings",
            title: "PC든 폰이든 <br /><em>바로 재생</em>",
            titleMobile: "PC든 폰이든, 어디서나 <em>케이디스크</em>",
            text: "감상도 다운로드도 한 곳에서",
          },
        ];
        const OTHERS = {
          wedisk: { color: "#46579b", deco: "squares", title: "찜해 둔 자료를 나중에 <br /><em>다시 보고 싶을 때</em>", text: "찜·다시보기 기능과 화면 전송을 함께 이용할 수 있는 웹하드예요" },
          filejo: { color: "#3b6391", deco: "blob", title: "인기 TOP100 목록부터 <br /><em>차근차근 보고 싶을 때</em>", text: "파일조 안에서 많이 찾는 콘텐츠를 순위로 먼저 살펴볼 수 있어요" },
          filenori: { color: "#3e61b1", deco: "rings", title: "모바일에서 찾은 작품을 <br /><em>전용 플레이어로 볼 때</em>", text: "모바일 탐색과 전용 플레이어를 함께 제공하는 서비스예요" },
          me2disk: { color: "#595ca6", deco: "stripes", title: "여러 장르의 자료를 <br /><em>한 곳에서 보고 싶을 때</em>", text: "다양한 자료와 고객지원을 함께 안내하는 웹하드예요" },
          filecast: { color: "#346f89", deco: "squares", title: "모바일 감상과 정액관을 <br /><em>함께 비교하고 싶을 때</em>", text: "개별 구매와 자유이용권 정액관을 함께 안내하는 서비스예요" },
          filestar: { color: "#e7284e", deco: "triangle", title: "고른 콘텐츠를 기다림 없이 <br /><em>실시간으로 볼 때</em>", text: "실시간 스트리밍과 모바일 전용 플레이어 앱을 함께 제공해요" },
          filesun: { color: "#f0500f", deco: "blob", title: "장르별로 둘러보면서 <br /><em>출석 혜택도 챙길 때</em>", text: "다양한 장르와 출석·쿠폰 이벤트를 안내하는 웹하드예요" },
          fileis: { color: "#3e7aa8", deco: "stripes", scale: 0.84, title: "할인 중인 콘텐츠를 <br /><em>바로 스트리밍할 때</em>", text: "실시간 스트리밍과 할인 콘텐츠를 함께 안내하는 서비스예요" },
          filecookie: { color: "#315eaa", deco: "triangle", title: "PC에서 구매한 자료를 <br /><em>모바일로 다시 볼 때</em>", text: "PC에서 산 자료를 모바일에서 재생할 수 있다고 안내해요" },
          bigfile: { color: "#1b9e52", title: "실시간 TOP100에서 <br /><em>인기 자료를 찾을 때</em>", text: "실시간·주간·월간 TOP100과 여러 카테고리를 함께 제공해요" },
          pdpop: { color: "#f06a0a", title: "인기 콘텐츠를 <br /><em>전용 프로그램으로 볼 때</em>", text: "인기 콘텐츠와 전용 프로그램 이용을 함께 안내하는 서비스예요" },
        };

        const R = window.OTT_WEBHARD_RANKING;
        const others = R
          ? R.snapshot()
              .order.filter((p) => OTHERS[p.id])
              .map((p) => ({
                id: p.id,
                name: p.name,
                logo: `assets/promo/${p.id}.png`,
                url: p.url,
                title: OTHERS[p.id].title,
                text: OTHERS[p.id].text || p.description,
                color: OTHERS[p.id].color,
                scale: OTHERS[p.id].scale,
                deco: OTHERS[p.id].deco,
              }))
          : [];

        let roll = Math.random() * 100;
        let ad = MAIN.find((a) => (roll -= a.weight) < 0);
        if (!ad) {
          // 순위를 못 읽었으면 온디스크·케이디스크 비율대로 둘 중 하나.
          ad = others.length
            ? others[Math.floor(Math.random() * others.length)]
            : MAIN[Math.random() * 65 < 35 ? 0 : 1];
        }

        // 온디스크·케이디스크는 눈에 더 띄게(큰 제목·꽉 찬 버튼).
        const featured = MAIN.includes(ad);
        host.className =
          `promo promo--${ad.id} promo--deco-${ad.deco || "lines"}` +
          (ad.color ? " promo--brand" : "") +
          (featured ? " promo--featured" : "");
        if (ad.color) host.style.setProperty("--brand", ad.color);
        host.innerHTML =
          `<a class="promo-link" href="${ad.url}" target="_blank" rel="sponsored noopener noreferrer" aria-label="${ad.name} 제휴 링크, 새 창에서 열기">` +
          `<span class="promo-badge">제휴</span>` +
          `<span class="promo-logo"><img src="${ad.logo}" alt="${ad.name}" /></span>` +
                    // 모바일 문구가 따로 있으면 좁은 화면에서는 그걸 보여 줍니다.
          `<span class="promo-body"><strong class="promo-title">` +
          (ad.titleMobile
            ? `<span class="promo-title-pc">${ad.title}</span><span class="promo-title-mo">${ad.titleMobile}</span>`
            : ad.title) +
          `</strong>` +
          `<span class="promo-text">${ad.text}</span></span>` +
          `<span class="promo-cta"><span class="promo-cta-name">${ad.name}</span>바로가기<span class="promo-arrow" aria-hidden="true">` +
          // 글자 "→" 는 글꼴마다 좌우 여백이 달라 가운데가 어긋나서, 가운데가 정확한 SVG 로 그립니다.
          `<svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 8h9M9 4.5 12.5 8 9 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>` +
          `</span></span>` +
          `</a>`;
        // 넓은 로고는 낮게, 네모난 로고는 높게: 높이 ∝ 1/√(가로÷세로).
        const img = host.querySelector(".promo-logo img");
        const fit = () => {
          if (img.naturalWidth && img.naturalHeight) {
            const k = 1 / Math.sqrt(img.naturalWidth / img.naturalHeight);
            img.style.setProperty("--k", (k * (ad.scale || 1)).toFixed(3));
          }
        };
        if (img.complete) fit();
        else img.addEventListener("load", fit, { once: true });
        host.hidden = false;
      })();
