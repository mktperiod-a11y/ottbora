function searchFrm_confirm() {
	var $frm = jQuery("form[name='searchFrm']")
		, $searchString = jQuery("input[name='search']")
		, $search_type = jQuery("select[name='search_type']")
		, $search_keyword = jQuery("select[name='search_keyword']");

	var realStr = $searchString.val().replace(/\s/gi, "");
	var chktext = /[`\~\!\@\#\$\%\^\&\(\)\-\=\_\+\[\]\;\'\.\,\/\{\}\:\"\<\>\?\\\/\*"']/g;
	var chktext1 = /[`\(\)\[\]]/g;
	var chkSpace = /^\s/;

	if ( $search_keyword.val() == 'nickname' )
	{
		if ( $searchString.val().length < 1 )
		{
			alert('검색어는 1자이상 입력하셔야 합니다.');
			$searchString.val('');
			$searchString.focus();
			return false;
		}

		if ( chktext.test($searchString.val()) )
		{
			alert("특수문자는 사용할 수 없습니다.");
			$searchString.val('');
			$searchString.focus();
			return false;
		}

		if ( realStr.length < 2 ) {
			alert('공백을 제거한 검색어는 2자 이상 입력하셔야 합니다.     ');
			$searchString.val('');
			$searchString.focus();
			return false;
		}

		if ( chkSpace.test($searchString.val()) )
		{
			alert("검색어 첫 글자는 공백을 사용할 수 없습니다.");
			$searchString.val('');
			$searchString.focus();
			return false;
		}

		$frm.submit();
		return false;
	}
	else
	{
		if ( $search_keyword.val() == 'docid' )
		{
			txt = $searchString.val();
			if ( !(txt >= 0 && txt <= 9999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999) )
			{
				alert(" 숫자만 입력가능합니다.");
				$searchString.val('');
				$searchString.focus();
				return false;
			}
			else
			{
				$frm.submit();
				return false;
			}
		}

		if ( $search_type.val() == '' ) {
			alert('검색분류를 선택해주세요.');
			$search_type.focus();
			return false;
		}

		if ( chkSpace.test($searchString.val()) )
		{
			alert("검색어 첫 글자는 공백을 사용할 수 없습니다.");
			$searchString.val('');
			$searchString.focus();
			return false;
		}
	}

	// 금칙어 체크
	jQuery.ajax({
		type : 'post',
		url : "/main/module/searchChk.php",
		dataType : "text",
		data: {
			'act' : 'ok',
			'type' : 0,
			'section' : $search_type.val(),
			'str' : $searchString.val(),
			'_searchChk_send_type' : 'ajax' // 호출방식 type 추가(한글인코딩 이슈) - 2020.07.09
		},
		timeout:3000,
		async:false,
		success:function(responseData) {
			// 금칙어 안내 레이어 팝업 가리기.
			jQuery("#banKeyword").css({'display':'none'});

			var res  = decodeURIComponent(responseData);
			// res 줄바꿈, 공백 제거.
			res = res.replace(/^\s+/, "");  // 왼쪽 공백 제거
			res = res.replace(/\s+$/g, "");  //오른쪽 공백 제거
			res = res.replace(/\n/g, "");  //행바꿈제거
			res = res.replace(/\r/g, "");  //엔터제거

			if ( res == 'maxprc' ) {
				alert('현재 사용자가 많아 검색이 지연되고 있습니다     \r\n잠시후에 다시 이용해주시기 바랍니다.     \r\n');
			}  else if (res == "restricted_contents" || res == "restricted_but_zero" || res == "restricted_cate"|| res == "restricted_cate_zero") {
				view_restrict_message(res);
				return false;
			} else if ( res == 'ok' ) {
				$frm.submit();
			} else {
				//alert('잠시 후 이용해 주십시요.     \r\n');
				return false;
			}
		},
		error:function(xhr, status, error) {
			//alert("잠시 후에 다시 시도해 주세요.");
		}
	});

	jQuery.ajax({
		type : 'post',
		url : '/main/module/search_keyword.php',
		dataType : "html",
		data: {
			'act' : 'search',
			'section' : $search_type.val(),
			'str' : $searchString.val()
		},
		timeout:3000,
		async:false,
		success:function(responseData) {},
		error:function() {}
	});
}
</script>

			<script type="text/javascript">
				(function($){
					// 기본 배열 생성
					function defaultArray(num){
						var result = [];

						for( var i=0; i<num; i++ ){
							result.push( i+1 );
						}

						return result;
					}
					// 배열 랜덤 생성
					function shuffleArray(array) {
						// 배열 복사 (원본 배열 유지)
						let shuffledArray = array.slice();
	
						// Fisher-Yates 알고리즘 적용
						for (let i = shuffledArray.length - 1; i > 0; i--) {
							let randomIndex = Math.floor(Math.random() * (i + 1)); // 0부터 i까지 랜덤 인덱스 생성
	
							// 임시 변수(temp)를 사용한 값 교환 (Swap)
							let temp = shuffledArray[i];
							shuffledArray[i] = shuffledArray[randomIndex];
							shuffledArray[randomIndex] = temp;
						}
	
						return shuffledArray;
					}
					let defaultEventNumber = defaultArray($(".main-event .list li").length);
					let copyRandomNumbers = shuffleArray(defaultEventNumber);
					// 이벤트 배너 위치 조정
					var mainEventWrap = $(".main-event .list")
					, mainEventBnnr = mainEventWrap.find("li");
					for( var i=0; i<copyRandomNumbers.length; i++ ){
						mainEventWrap.append( mainEventBnnr.eq(copyRandomNumbers[i] - 1) );
					}
				})(jQuery);
			</script>
