		if (subCategory != "") subOption = "";
		
		if (category == "11" && !loginData.isLogin) {
			util_layerMemberlogin();return;

			if(util_adultBlock()) { return false; }

function goInstallProgramQna() {
	const browserInfo = getBrowserInfo();
// 	alert(browserInfo.browserName);return;
	var qnaID = '';
	if(browserInfo.browserName == 'Chrome') {
		qnaID = '242';
	} else if(browserInfo.browserName == 'Edge') {
		qnaID = '412';
	} else {		
	}
	var sendData = {cateNO:'01', cateSubNO:'2', qnaID:qnaID};
	window.location.href = "/noriNew/Support/quickQNAList.do?data=" + encodeURI(JSON.stringify(sendData));
}
function getBrowserInfo() {
	const userAgent = navigator.userAgent;
  	let browserName = "Unknown";
  	let browserVersion = "Unknown";

  	if (userAgent.includes("Chrome") && !userAgent.includes("Edg")) {
    	browserName = "Chrome";
    	browserVersion = userAgent.match(/Chrome\/([0-9.]+)/)?.[1];
  	} else if (userAgent.includes("Firefox")) {
    	browserName = "Firefox";
    	browserVersion = userAgent.match(/Firefox\/([0-9.]+)/)?.[1];
  	} else if (userAgent.includes("Edg")) {
    	browserName = "Edge";
    	browserVersion = userAgent.match(/Edg\/([0-9.]+)/)?.[1];
  	} else if (userAgent.includes("Safari") && !userAgent.includes("Chrome")) {
    	browserName = "Safari";
    	browserVersion = userAgent.match(/Version\/([0-9.]+)/)?.[1];
	}

  	return { browserName, browserVersion };
}
