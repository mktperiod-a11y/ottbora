<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <!--
      제휴 이동 페이지: 사이트 안의 모든 파일썬 링크는 이 주소(go/filesun/)를 가리키고,
      지금은 공식 홈페이지로 넘깁니다. 파트너 코드를 받으면 그 링크로 바꿉니다.
      이동할 주소가 바뀌면 이 파일의 주소 세 곳만 바꾸면 됩니다.
    -->
    <meta http-equiv="refresh" content="0;url=https://www.filesun.com/" />
    <title>파일썬로 이동 중 | 오티티보라</title>
  </head>
  <body>
    <p>
      파일썬 공식 사이트로 이동 중입니다. 자동으로 이동하지 않으면
      <a href="https://www.filesun.com/" rel="sponsored noopener">여기를 눌러주세요.</a>
    </p>
    <script>
      location.replace("https://www.filesun.com/");
    </script>
  </body>
</html>
