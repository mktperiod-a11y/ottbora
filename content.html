    <script>

      const PER_PAGE = 20;
      const MAX_PAGES = 3;

      const TYPES = ["전체", "영화", "드라마", "예능", "애니"];

      const CHIP =
        "seed-action-chip seed-action-chip--size_medium" +
        " seed-action-chip--layout_withText" +
        " seed-action-chip--size_medium-layout_withText";

      const FALLBACK =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'" +
        " viewBox='0 0 2 3'%3E%3Crect width='2' height='3' fill='%23eef1f5'/%3E%3C/svg%3E";

      const poster = (id) => (window.OTT_POSTERS || {})[id] || FALLBACK;

      window.ottImgFail = (el) => {
        el.onerror = null;
        el.src = FALLBACK;
      };
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      let DATA = null;
      let RANKS = new Map();
      let FRESH = false
      const params = new URLSearchParams(location.search);
      let active = TYPES.includes(params.get("tab")) ? params.get("tab") : "전체";
      let page = Math.max(1, Math.min(MAX_PAGES, Number(params.get("page")) || 1));

      function syncUrl() {
        const q = new URLSearchParams();
        if (active !== "전체") q.set("tab", active);
        if (page > 1) q.set("page", String(page));
        const next = q.toString() ? `?${q}` : location.pathname;
        history.replaceState(null, "", next);
      }

      const STALE_DAYS = 10;

      function manualDate(raw) {
        const m = String(raw || "").match(/(\d{4})[.\-](\d{1,2})[.\-](\d{1,2})/);
        return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
      }
      function manualExpired(w, rule) {
        if (!rule) return false;
        let end = manualDate(w.endedAt);
        if (!end) {
          const start = manualDate(w.releasedAt);
          const run = Number(rule.estimatedRunMonths?.[w.type]);
          if (!start || !run) return false;
          end = new Date(start);
          end.setUTCMonth(end.getUTCMonth() + run);
        }
        const until = new Date(end);
        until.setUTCMonth(until.getUTCMonth() + (Number(rule.afterEndMonths) || 6));
        return Date.now() > until.getTime();
      }

      function isRecentDate(raw, days) {
        const m = String(raw || "").match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
        if (!m) return false;
        const then = Date.UTC(+m[1], +m[2] - 1, +m[3]);
        const now = new Date();
        const today = Date.UTC(
          now.getUTCFullYear(),
          now.getUTCMonth(),
          now.getUTCDate(),
        );
        const age = (today - then) / 86400000;
        return age >= 0 && age <= days;
      }

      function isFresh(latestDt) {
        return isRecentDate(latestDt, STALE_DAYS);
      }

      function opened(raw, suffix = "개봉") {
        const m = String(raw || "").match(/(\d{4})[-.]?(\d{2})[-.]?(\d{2})/);
        return m ? `${+m[2]}월 ${+m[3]}일 ${suffix}` : "";
      }

      function audience(n) {
        if (!n || n < 10000) return "";
        const man = Math.round(n / 10000);
        return man >= 10000
          ? `누적 ${(man / 10000).toFixed(1)}억`
          : `누적 ${man}만`;
      }

      const key = (t) =>
        String(t || "")
          .toLowerCase()
          .replace(/[^0-9a-z가-힣]/g, "");

      const TINTS = 6;
      function tint(seed) {
        let h = 0;
        for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) % 9973;
        return h % TINTS;
      }

      const TOP_N = 3;

      function credit(title, fallback) {
        const r = FRESH ? RANKS.get(key(title)) : null;
        return r && r <= TOP_N ? `국내 박스오피스 ${r}위` : fallback || "";
      }

      function metaLine(type, genre, when) {
        const sub = genre && genre !== type ? genre : "";
        const rest = [sub, when].filter(Boolean).join(" · ");
        return (
          `<span class="genre" title="${esc([type, sub, when].filter(Boolean).join(" · "))}">` +
          `<b>${esc(type)}</b>` +
          (rest ? ` · ${esc(rest)}` : "") +
          `</span>`
        );
      }

      const TMDB_TV_GENRE = {
        10759: "액션",
        16: "애니메이션",
        35: "코미디",
        80: "범죄",
        99: "다큐",
        18: "드라마",
        10751: "가족",
        10762: "어린이",
        9648: "미스터리",
        10763: "뉴스",
        10764: "리얼리티",
        10765: "SF·판타지",
        10766: "일일드라마",
        10767: "토크",
        10768: "시사·교양",
        37: "서부",
      };

      function mainGenre(list, type) {
        const skip = new Set([type, "애니메이션", "드라마", "영화"]);
        const picked = (list || []).find((g) => g && !skip.has(g));
        return picked || (list || [])[0] || "";
      }

      const MAX_TAGS = 3;

      function tagRow(tags) {
        const shown = tags.filter(Boolean).slice(0, MAX_TAGS);
        if (!shown.length) return "";
        return (
          `<div class="tags">` +
          shown.map((t) => `<span class="tag">#${esc(t)}</span>`).join("") +
          `</div>`
        );
      }

      function badge(text) {
        return (
          `<span class="seed-badge__root seed-badge__root--size_medium` +
          ` seed-badge__root--variant_weak` +
          ` seed-badge__root--tone_neutral-variant_weak">` +
          `<span class="seed-badge__label">${esc(text)}</span></span>`
        );
      }

      function netflixOriginalTag(w) {
        if (w.type !== "드라마" && w.type !== "예능") return "";
        const auto = (w.networks || []).some((n) => /^netflix$/i.test(String(n).trim()));
        return w.netflixOriginal === true || auto ? "넷플릭스 오리지널" : "";
      }

      function pickedCard(w) {
        const genre = String(w.genre || "").split(" · ")[0];

        const tags = [credit(w.title, w.pickedBy), netflixOriginalTag(w)];
        return (
          `<a class="card" href="content-detail.html?id=${encodeURIComponent(w.id)}">` +
          `<span class="thumb">` +
          `<img src="${poster(w.id)}" alt="${esc(w.title)} 포스터" loading="lazy"` +
          ` referrerpolicy="no-referrer" onerror="ottImgFail(this)">` +
          `</span>` +
          `<div class="cb"><b>${esc(w.title)}</b>` +
          metaLine(w.type, genre, opened(w.releasedAt)) +
          tagRow(tags) +
          `</div></a>`
        );
      }

      function boxCard(m) {
        const tags = [credit(m.title, ""), audience(m.audienceAcc)];

        const body =
          `<div class="cb"><b>${esc(m.title)}</b>` +
          metaLine(m.type, mainGenre(m.genres, m.type), opened(m.openedAt)) +
          tagRow(tags) +
          `</div>`;

        if (m.poster) {
          return (
            `<a class="card" href="content-detail.html?id=${encodeURIComponent(`kofic-${m.movieCd}`)}">` +
            `<span class="thumb">` +
            `<img src="${esc(m.poster)}" alt="${esc(m.title)} 포스터" loading="lazy"` +
            ` onerror="ottImgFail(this)">` +
            `</span>` + body +
            `</a>`
          );
        }

        return (
          `<a class="card card--text" href="content-detail.html?id=${encodeURIComponent(`kofic-${m.movieCd}`)}">` +
          `<div class="panel panel--t${tint(m.movieCd)}">` +
          `<b class="panel-title">${esc(m.title)}</b>` +
          `</div>` + body +
          `</a>`
        );
      }

      function animeCard(a) {
        const tags = [
          a.score ? `평점 ${a.score}` : "지금 방영 중",
        ];

        const body =
          `<div class="cb"><b>${esc(a.title)}</b>` +
          metaLine(
            "애니",
            mainGenre(a.genres, "애니"),
            a.episodes ? `${a.episodes}화` : "",
          ) +
          tagRow(tags) +
          `</div>`;

        if (a.poster) {
          return (
            `<a class="card" href="content-detail.html?id=${encodeURIComponent(`anime-${a.malId}`)}">` +
            `<span class="thumb">` +
            `<img src="${esc(a.poster)}" alt="${esc(a.title)} 포스터" loading="lazy"` +
            ` onerror="ottImgFail(this)">` +
            `</span>` + body +
            `</a>`
          );
        }

        return (
          `<a class="card card--text" href="content-detail.html?id=${encodeURIComponent(`anime-${a.malId}`)}">` +
          `<div class="panel panel--t${tint(String(a.malId))}">` +
          `<b class="panel-title">${esc(a.title)}</b>` +
          `</div>` + body +
          `</a>`
        );
      }

      function tmdbCard(w) {
        const genre = TMDB_TV_GENRE[(w.genres || [])[0]] || "";

        const when = w.nextAirDate
          ? opened(w.nextAirDate, "방송")
          : isRecentDate(w.firstAirDate, 365)
            ? opened(w.firstAirDate, "첫 방송")
            : "";

        const tags = [
          w.rank && w.rank <= 20 ? `인기 ${w.rank}위` : "",
          netflixOriginalTag(w),
        ];

        const body =
          `<div class="cb"><b>${esc(w.title)}</b>` +
          metaLine(w.type, genre, when) +
          tagRow(tags) +
          `</div>`;

        if (w.poster) {
          return (
            `<a class="card" href="content-detail.html?id=${encodeURIComponent(`tmdb-${w.tmdbId}`)}">` +
            `<span class="thumb">` +
            `<img src="${esc(w.poster)}" alt="${esc(w.title)} 포스터" loading="lazy"` +
            ` referrerpolicy="no-referrer" onerror="ottImgFail(this)">` +
            `</span>` + body +
            `</a>`
          );
        }

        return (
          `<a class="card card--text" href="content-detail.html?id=${encodeURIComponent(`tmdb-${w.tmdbId}`)}">` +
          `<div class="panel panel--t${tint(String(w.tmdbId))}">` +
          `<b class="panel-title">${esc(w.title)}</b>` +
          `</div>` + body +
          `</a>`
        );
      }

      function pool() {
        const anime = (DATA.anime || []).map((a) => ({ kind: "anime", a }));

        if (active === "애니") return anime;

        const picked = DATA.works
          .filter((w) => active === "전체" || w.type === active)
          .map((w) => ({ kind: "picked", w }));
        const pickedSeen = new Set(picked.map((x) => key(x.w.title)));

        const tv = (DATA.tv || [])
          .filter(
            (w) =>
              (active === "전체" || w.type === active) &&
              !pickedSeen.has(key(w.title)),
          )
          .map((w) => ({ kind: "tmdb", w }));

        const box = (DATA.boxoffice || [])
          .filter(
            (m) =>
              (active === "전체" || m.type === active) &&
              !pickedSeen.has(key(m.title)),
          )
          .sort((a, b) => Number(b.showing) - Number(a.showing))
          .map((m) => ({ kind: "box", m }));

        if (active === "드라마" || active === "예능") return [...tv, ...picked];
        if (active !== "전체") return [...picked, ...box];

        return roundRobin([picked, box, tv, anime]);
      }

      function roundRobin(lanes) {
        const total = lanes.reduce((n, lane) => n + lane.length, 0);
        const out = [];
        for (let i = 0; out.length < total; i += 1) {
          for (const lane of lanes) if (lane[i]) out.push(lane[i]);
        }
        return out;
      }

      function pager(pages) {
        if (pages < 2) return "";
        const btn = (n) =>
          `<button class="${CHIP} page-btn" data-page="${n}"` +
          ` aria-current="${n === page ? "page" : "false"}">${n}</button>`;
        return (
          `<nav class="pager" aria-label="페이지 넘기기">` +
          Array.from({ length: pages }, (_, i) => btn(i + 1)).join("") +
          `</nav>`
        );
      }

      function render() {
        const all = pool();
        const capped = all.slice(0, PER_PAGE * MAX_PAGES);
        const pages = Math.max(1, Math.ceil(capped.length / PER_PAGE));
        if (page > pages) page = 1;

        const shown = capped.slice((page - 1) * PER_PAGE, page * PER_PAGE);
        const host = document.querySelector("#sections");

        if (!shown.length) {
          document.querySelector("#count").textContent = `${active} 0건`;
          host.innerHTML = `<p class="empty">${esc(active)} 분류는 아직 준비 중입니다.</p>`;
          return;
        }

        const cut = all.length > capped.length;
        document.querySelector("#count").textContent = !cut
          ? `${active} ${capped.length}건`
          : active === "전체"
            ? `전체 ${capped.length}건 · 나머지는 분류 탭에서 확인`
            : `${active} 상위 ${capped.length}건`;

        host.innerHTML =
          `<div class="cards grid">` +
          shown
            .map((x) =>
              x.kind === "picked"
                ? pickedCard(x.w)
                : x.kind === "box"
                  ? boxCard(x.m)
                  : x.kind === "anime"
                    ? animeCard(x.a)
                    : tmdbCard(x.w),
            )
            .join("") +
          `</div>` +
          pager(pages);

        host.querySelectorAll(".page-btn").forEach((b) => {
          b.onclick = () => {
            page = Number(b.dataset.page);
            syncUrl();
            render();
            toTop();
          };
        });
      }

      function toTop() {
        const f = document.querySelector(".filters");
        if (f.getBoundingClientRect().top < 0) {
          f.scrollIntoView({ block: "start", behavior: "instant" });
        }
      }

      function tabs() {
        const host = document.querySelector(".filters");
        host.innerHTML = TYPES.map(
          (t) =>
            `<button class="${CHIP}" role="tab" data-type="${esc(t)}"` +
            ` aria-selected="${t === active}">${esc(t)}</button>`,
        ).join("");
        host.querySelectorAll("button").forEach((b) => {
          b.onclick = () => {
            active = b.dataset.type;
            page = 1;
            syncUrl();
            host.querySelectorAll("button").forEach((x) =>
              x.setAttribute("aria-selected", String(x === b)),
            );
            render();
            toTop();
          };
        });
      }

      const optional = (url) =>
        fetch(url)
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);

      Promise.all([
        fetch("assets/content-data.json?v=20260929-3").then((r) => r.json()),
        optional("assets/boxoffice.json"),
        optional("assets/anime.json"),
        optional("assets/tv-ranking.json"),
      ])
        .then(([d, box, anime, tv]) => {
          DATA = d;
          DATA.works = (DATA.works || []).filter((w) => !manualExpired(w, DATA.expiry));
          DATA.boxoffice = Array.isArray(box?.movies) ? box.movies : [];
          DATA.anime = Array.isArray(anime?.works) ? anime.works : [];
          DATA.tv = isRecentDate(tv?.updatedAt, 14)
            ? [
                ...(Array.isArray(tv?.drama) ? tv.drama : []),
                ...(Array.isArray(tv?.variety) ? tv.variety : []),
              ]
            : [];
          FRESH = isFresh(box?.latestDt);
          for (const m of DATA.boxoffice) {
            if (m.rank) RANKS.set(key(m.title), m.rank);
          }
          const sources = [
            ...new Set(
              [...DATA.boxoffice, ...DATA.anime, ...DATA.tv]
                .map((x) => x.posterCredit)
                .filter(Boolean),
            ),
          ];
          if (sources.length)
            document.querySelector("#poster-credit").textContent =
              `포스터 출처: ${sources.join(", ")}`;
          tabs();
          render();
          syncUrl();
        })
        .catch(() => {
          document.querySelector("#sections").innerHTML =
            '<p class="empty">작품 정보를 불러오지 못했습니다.</p>';
        });
    </script>
  </body>
</html>
