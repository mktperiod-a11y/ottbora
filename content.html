    <main class="wrap" id="main">
      <span class="ey">CONTENT ZONE</span>
      <h1>오늘 뭐 볼까?</h1>
      <p class="sub">
        분류를 고르고 포스터를 누르면 줄거리와 관전 포인트, 공식 시청 경로를
        볼 수 있습니다.

      <div class="filters" role="tablist" aria-label="분류 선택"></div>


      <div id="sections"></div>

      <aside
        class="seed-callout__root seed-callout__root--tone_neutral policy"
        aria-label="선정 기준과 표시 방침"
      >
        <div class="seed-callout__content">
          <strong class="seed-callout__title seed-callout__title--tone_neutral"

    <footer>
      <div class="wrap footer-row">
        <p>
          © 2026 OTT BORA. 콘텐츠 포스터와 작품 정보는 각 권리자에게 귀속됩니다.

    <script src="assets/posters-featured-20260828.js"></script>
    <script src="assets/posters-archive-20260828.js"></script>
    <script>
      // 작품 목록은 두 곳에서 옵니다.
      //   content-data.json — 손으로 고른 작품. 포스터와 상세 페이지가 있습니다.
      //   boxoffice.json    — KOFIC 일별 박스오피스를 누적한 목록. 포스터가 없습니다.
      // KOFIC 은 포스터를 주지 않으므로 박스오피스 쪽은 글자 카드로 그립니다.

      const PER_PAGE = 20;
      const MAX_PAGES = 3; // 한 탭에 최대 60편

      const TYPES = ["전체", "영화", "드라마", "예능", "애니"];

      const CHIP =
        "seed-action-chip seed-action-chip--size_medium" +
        " seed-action-chip--layout_withText" +
        " seed-action-chip--size_medium-layout_withText";

      const FALLBACK =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'" +
        " viewBox='0 0 2 3'%3E%3Crect width='2' height='3' fill='%23eef1f5'/%3E%3C/svg%3E";

      const poster = (id) => (window.OTT_POSTERS || {})[id] || FALLBACK;
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      // 예매 링크는 데이터 파일에서 오므로, 상세 페이지와 같은 방식으로
      // https 인지와 호스트가 목록에 있는지를 확인한 뒤에만 겁니다.
      const CINEMA_HOSTS = new Set([
        "cgv.co.kr",
        "www.megabox.co.kr",
        "www.lottecinema.co.kr",
      ]);
      const safe = (raw, allow) => {
        try {
          const u = new URL(raw);
          return u.protocol === "https:" && allow.has(u.hostname) ? u.href : "";
        } catch {
          return "";
        }
      };

      let DATA = null;
      let CINEMAS = []; // 예매 링크가 확인된 극장 체인
      let FRESH = false; // 박스오피스 집계가 예매를 권할 만큼 최근인가
      let active = "전체";
      let page = 1;

      /**
       * 집계일이 오래되면 예매 칩을 달지 않습니다.
       * 갱신 워크플로가 멈춘 채로 두면 이미 내려간 영화에 예매 링크가
       * 계속 붙게 되는데, 그건 사실이 아닌 안내가 됩니다.
       */
      const STALE_DAYS = 10;
      function isFresh(latestDt) {
        const m = String(latestDt || "").match(/^(\d{4})(\d{2})(\d{2})$/);
        if (!m) return false;
        const then = Date.UTC(+m[1], +m[2] - 1, +m[3]);
        const now = new Date();
        const today = Date.UTC(
          now.getUTCFullYear(),
          now.getUTCMonth(),
          now.getUTCDate(),
        );
        return (today - then) / 86400000 <= STALE_DAYS;
      }

      /** "20260916" 또는 "2026-09-16" → "9월 16일 개봉" */
      function opened(raw) {
        const m = String(raw || "").match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
        return m ? `${+m[2]}월 ${+m[3]}일 개봉` : "";
      }

      /** 403897 → "누적 40만". 만 단위 아래는 반올림해 읽기 쉽게 둡니다. */
      function audience(n) {
        if (!n || n < 10000) return "";
        const man = Math.round(n / 10000);
        return man >= 10000
          ? `누적 ${(man / 10000).toFixed(1)}억`
          : `누적 ${man}만`;
      }

      /** 제목 비교용. 공백과 문장부호를 떼고 맞춥니다. */
      const key = (t) =>
        String(t || "")
          .toLowerCase()
          .replace(/[^0-9a-z가-힣]/g, "");

      /**
       * 포스터가 없는 카드의 바탕색을 고릅니다.
       * movieCd 를 섞어 여섯 가지 중 하나로 보내, 목록이 한 가지 색으로
       * 깔리지 않게 합니다. 같은 작품은 늘 같은 색이 나옵니다.
       */
      const TINTS = 6;
      function tint(seed) {
        let h = 0;
        for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) % 9973;
        return h % TINTS;
      }

      function badge(text) {
        return (
          `<span class="seed-badge__root seed-badge__root--size_medium` +
          ` seed-badge__root--variant_weak` +
          ` seed-badge__root--tone_neutral-variant_weak">` +
          `<span class="seed-badge__label">${esc(text)}</span></span>`
        );
      }

      /** 손으로 고른 작품 — 포스터가 있고 상세 페이지로 넘어갑니다. */
      function pickedCard(w) {
        // 제공처와 근거는 역할이 다르므로 표기도 나눕니다.
        //  · 제공처(watch) = 어디서 볼 수 있는가 → 중립 칩
        //  · 근거(pickedBy) = 왜 실렸는가 → 작은 회색 글씨
        // 근거 문구에는 제공처 이름을 넣지 않습니다. 칩이 이미 말합니다.
        const where = w.watch.map((x) => badge(x.name)).join("");
        const why = w.pickedBy
          ? `<span class="why">${esc(w.pickedBy)}</span>`
          : "";
        const meta = where || why ? `<div class="meta-row">${where}${why}</div>` : "";
        // 분류는 탭이 이미 말하므로, 전체 탭에서만 함께 적습니다.
        const line = active === "전체" ? `${w.type} · ${w.genre}` : w.genre;
        return (
          `<a class="card" href="content-detail.html?id=${encodeURIComponent(w.id)}">` +
          `<img src="${poster(w.id)}" alt="${esc(w.title)} 포스터" loading="lazy"` +
          ` referrerpolicy="no-referrer"` +
          ` onerror="this.onerror=null;this.src='${FALLBACK}'">` +
          `<div class="cb"><b>${esc(w.title)}</b>` +
          `<span class="genre">${esc(line)}</span>${meta}</div></a>`
        );
      }

      /**
       * 박스오피스에서 온 작품 — 포스터가 없어 제목을 크게 두는 글자 카드입니다.
       * 상세 페이지가 없으므로 카드 전체를 링크로 만들지 않습니다.
       * 대신 지금 극장에 걸려 있는 작품에만 예매 칩을 답니다.
       */
      function boxCard(m) {
        const genre = m.genres.join(" · ");
        const facts = [opened(m.openedAt), audience(m.audienceAcc)]
          .filter(Boolean)
          .join(" · ");

        // 예매 칩의 근거는 "마지막 집계일에도 차트에 있었다" 입니다.
        // 그 사실이 없으면 예매 링크를 걸지 않습니다.
        const book =
          m.showing && FRESH && CINEMAS.length
            ? `<div class="book">` +
              CINEMAS.map(
                (c) =>
                  `<a class="${CHIP} book-chip" href="${c.href}"` +
                  ` target="_blank" rel="noopener noreferrer"` +
                  ` title="${esc(c.name)} 예매 페이지로 이동합니다">` +
                  `${esc(c.short)}</a>`,
              ).join("") +
              `</div>`
            : "";

        const top = [active === "전체" ? m.type : "", genre]
          .filter(Boolean)
          .join(" · ");
        return (
          `<article class="card card--text">` +
          `<div class="panel panel--t${tint(m.movieCd)}">` +
          `<span class="panel-top">${esc(top)}</span>` +
          `<b class="panel-title">${esc(m.title)}</b>` +
          `<span class="panel-facts">${esc(facts)}</span>` +
          `</div>` +
          (book ? `<div class="cb">${book}</div>` : "") +
          `</article>`
        );
      }

      /** 지금 탭에 보여 줄 작품 전체. 손으로 고른 작품이 앞에 옵니다. */
      function pool() {
        const picked = DATA.works.filter(
          (w) => active === "전체" || w.type === active,
        );
        // 같은 작품이 양쪽에 있으면 포스터와 상세가 있는 쪽을 남깁니다.
        const seen = new Set(picked.map((w) => key(w.title)));
        const box = (DATA.boxoffice || []).filter(
          (m) =>
            (active === "전체" || m.type === active) && !seen.has(key(m.title)),
        );
        return [
          ...picked.map((w) => ({ kind: "picked", w })),
          ...box.map((m) => ({ kind: "box", m })),
        ];
      }

      function pager(pages) {
        if (pages < 2) return "";
        const btn = (n) =>
          `<button class="${CHIP} page-btn" data-page="${n}"` +
          ` aria-current="${n === page ? "page" : "false"}">${n}</button>`;
        return (
          `<nav class="pager" aria-label="페이지 넘기기">` +
          Array.from({ length: pages }, (_, i) => btn(i + 1)).join("") +
          `</nav>`
        );
      }

      function render() {
        // 탭 안에는 그 분류의 작품만 놓습니다. 시청 경로는 카드가 직접
        // 표시하므로(넷플릭스 등) status 로 다시 묶지 않습니다.
        const all = pool();
        const capped = all.slice(0, PER_PAGE * MAX_PAGES);
        const pages = Math.max(1, Math.ceil(capped.length / PER_PAGE));
        if (page > pages) page = 1;

        const shown = capped.slice((page - 1) * PER_PAGE, page * PER_PAGE);
        const host = document.querySelector("#sections");

        if (!shown.length) {
          host.innerHTML = `<p class="empty">${esc(active)} 분류는 아직 준비 중입니다.</p>`;
          return;
        }

        const more =
          all.length > capped.length
            ? `<p class="count-note">${all.length}건 중 ${capped.length}건을 보여 줍니다.</p>`
            : "";

        host.innerHTML =
          `<div class="grid">` +
          shown
            .map((x) => (x.kind === "picked" ? pickedCard(x.w) : boxCard(x.m)))
            .join("") +
          `</div>` +
          pager(pages) +
          more;

        host.querySelectorAll(".page-btn").forEach((b) => {
          b.onclick = () => {
            page = Number(b.dataset.page);
            render();
            // 페이지를 넘기면 목록 맨 위로 돌아갑니다.
            document
              .querySelector(".filters")
              .scrollIntoView({ block: "start" });
          };
        });
      }

      function tabs() {
        const host = document.querySelector(".filters");
        host.innerHTML = TYPES.map(
          (t) =>
            `<button class="${CHIP}" role="tab" data-type="${esc(t)}"` +
            ` aria-selected="${t === active}">${esc(t)}</button>`,
        ).join("");
        host.querySelectorAll("button").forEach((b) => {
          b.onclick = () => {
            active = b.dataset.type;
            page = 1;
            host.querySelectorAll("button").forEach((x) =>
              x.setAttribute("aria-selected", String(x === b)),
            );
            render();
          };
        });
      }

      // 박스오피스와 예매 링크는 없어도 페이지가 뜨도록 따로 받습니다.
      // 손으로 고른 작품만 있어도 목록은 성립하기 때문입니다.
      const optional = (url) =>
        fetch(url)
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);

      Promise.all([
        fetch("assets/content-data.json").then((r) => r.json()),
        optional("assets/boxoffice.json"),
        optional("assets/cinema-links.json"),
      ])
        .then(([d, box, cinema]) => {
          DATA = d;
          DATA.boxoffice = Array.isArray(box?.movies) ? box.movies : [];
          FRESH = isFresh(box?.latestDt);
          CINEMAS = (cinema?.chains || [])
            .map((c) => ({
              name: c.name,
              // short 가 없으면 전체 이름을 씁니다. 줄이 넘칠 뿐 링크는 삽니다.
              short: c.short || c.name,
              href: safe(c.bookingUrl, CINEMA_HOSTS),
            }))
            .filter((c) => c.href);

          document.querySelector("#policy-text").textContent =
            `${d.selectionPolicy} ${d.watchNote} 확인일 ${d.checkedAt}.`;
          document.querySelector("#partner-text").textContent =
            d.partnerDisclosure;
          tabs();
          render();
        })
        .catch(() => {
          document.querySelector("#sections").innerHTML =
            '<p class="empty">작품 정보를 불러오지 못했습니다.</p>';
        });
    </script>
  </body>
