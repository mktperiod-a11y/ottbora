<!doctype html>
<html lang="ko" data-seed-color-mode="light-only">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>콘텐츠ZONE | 영화·드라마·예능 - 오티티보라</title>
    <meta
      name="description"
      content="2026 최신 영화, 드라마, 예능 20편을 포스터와 줄거리, 출연진, 관전 포인트로 살펴보세요."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link
      rel="canonical"
      href="https://mktperiod-a11y.github.io/ottbora/content.html"
    />
    <link
      rel="stylesheet"
      href="assets/fonts/pretendard/pretendardvariable-dynamic-subset.css"
    />
    <link rel="stylesheet" href="assets/seed/seed.css" />
    <link rel="stylesheet" href="assets/seed-theme.css" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/content.css" />
  </head>
  <body>
    <a class="skip" href="#main">본문으로 바로가기</a>
    <header class="site-header">
      <nav class="wrap nav" aria-label="주요 메뉴">
        <a class="logo" href="index.html"
          ><i aria-hidden="true">▶</i>오티티<span>보라</span></a
        >
        <div class="menu">
          <a href="webhard.html">웹하드 순위</a
          ><a class="on" aria-current="page" href="content.html">콘텐츠ZONE</a
          ><a href="criteria.html">이용 가이드</a>
        </div>
      </nav>
    </header>
    <main class="wrap" id="main">
      <span class="ey">CONTENT ZONE</span>
      <h1>오늘 뭐 볼까?</h1>
      <p class="sub">
        분류를 고르고 포스터를 누르면 줄거리와 관전 포인트, 공식 시청 경로를
        볼 수 있습니다.
      </p>

      <aside
        class="seed-callout__root seed-callout__root--tone_neutral policy"
        aria-label="선정 기준과 표시 방침"
      >
        <div class="seed-callout__content">
          <strong class="seed-callout__title seed-callout__title--tone_neutral"
            >선정 기준과 표시 방침</strong
          >
          <p
            class="seed-callout__description seed-callout__description--tone_neutral"
            id="policy-text"
          ></p>
        </div>
      </aside>

      <div class="filters" role="tablist" aria-label="분류 선택"></div>


      <div id="sections"></div>

      <aside class="partner" aria-labelledby="partner-title">
        <h2 id="partner-title">제휴 웹하드</h2>
        <p id="partner-text"></p>
        <p class="partner-links">
          <a
            class="seed-action-button seed-action-button--variant_neutralSolid seed-action-button--size_medium seed-action-button--layout_withText seed-action-button--size_medium-layout_withText"
            href="webhard.html"
            >웹하드 비교 보기</a
          >
        </p>
      </aside>
    </main>
    <footer>
      <div class="wrap footer-row">
        <p>
          © 2026 OTT BORA. 콘텐츠 포스터와 작품 정보는 각 권리자에게 귀속됩니다.
        </p>
      </div>
    </footer>
    <script src="assets/posters-featured-20260828.js"></script>
    <script src="assets/posters-archive-20260828.js"></script>
    <script>
      // 분류 탭. 데이터에 항목이 없어도 탭은 보여 주고 빈 상태를 안내합니다.
      const TYPES = ["전체", "영화", "드라마", "예능", "애니"];


      const CHIP =
        "seed-action-chip seed-action-chip--size_medium" +
        " seed-action-chip--layout_withText" +
        " seed-action-chip--size_medium-layout_withText";

      const FALLBACK =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'" +
        " viewBox='0 0 2 3'%3E%3Crect width='2' height='3' fill='%23eef1f5'/%3E%3C/svg%3E";

      const poster = (id) => (window.OTT_POSTERS || {})[id] || FALLBACK;
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      let DATA = null;
      let active = "전체";

      function card(w) {
        // 선정 근거와 시청 경로는 확인된 작품에만 표시합니다.
        const badge = w.pickedBy
          ? `<span class="seed-badge__root seed-badge__root--size_medium` +
            ` seed-badge__root--variant_weak` +
            ` seed-badge__root--tone_brand-variant_weak picked">` +
            `<span class="seed-badge__label">${esc(w.pickedBy)}</span></span>`
          : "";
        const where = w.watch.length
          ? `<span class="where">${w.watch.map((x) => esc(x.name)).join(" · ")}</span>`
          : "";
        return (
          `<a class="card" href="content-detail.html?id=${encodeURIComponent(w.id)}">` +
          `<img src="${poster(w.id)}" alt="${esc(w.title)} 포스터" loading="lazy"` +
          ` referrerpolicy="no-referrer"` +
          ` onerror="this.onerror=null;this.src='${FALLBACK}'">` +
          `<div class="cb">${badge}<b>${esc(w.title)}</b>` +
          `<span>${esc(w.type)} · ${esc(w.genre)}</span>${where}</div></a>`
        );
      }

      function render() {
        // 탭 안에는 그 분류의 작품만 놓습니다. 시청 경로는 카드가 직접
        // 표시하므로(넷플릭스 등) status 로 다시 묶지 않습니다.
        const pool = DATA.works.filter(
          (w) => active === "전체" || w.type === active,
        );
        const host = document.querySelector("#sections");

        host.innerHTML = pool.length
          ? `<div class="grid">${pool.map(card).join("")}</div>`
          : `<p class="empty">${esc(active)} 분류는 아직 준비 중입니다.</p>`;
      }

      function tabs() {
        const host = document.querySelector(".filters");
        host.innerHTML = TYPES.map(
          (t) =>
            `<button class="${CHIP}" role="tab" data-type="${esc(t)}"` +
            ` aria-selected="${t === active}">${esc(t)}</button>`,
        ).join("");
        host.querySelectorAll("button").forEach((b) => {
          b.onclick = () => {
            active = b.dataset.type;
            host.querySelectorAll("button").forEach((x) =>
              x.setAttribute("aria-selected", String(x === b)),
            );
            render();
          };
        });
      }

      fetch("assets/content-data.json")
        .then((r) => r.json())
        .then((d) => {
          DATA = d;
          document.querySelector("#policy-text").textContent =
            `${d.selectionPolicy} ${d.watchNote} 확인일 ${d.checkedAt}.`;
          document.querySelector("#partner-text").textContent =
            d.partnerDisclosure;
          tabs();
          render();
        })
        .catch(() => {
          document.querySelector("#sections").innerHTML =
            '<p class="empty">작품 정보를 불러오지 못했습니다.</p>';
        });
    </script>
  </body>
</html>
