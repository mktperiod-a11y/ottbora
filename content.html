    <script>
      // 작품 목록은 두 곳에서 옵니다.
      //   content-data.json — 손으로 고른 작품. 포스터와 상세 페이지가 있습니다.
      //   boxoffice.json    — KOFIC 일별 박스오피스를 누적한 목록. 포스터가 없습니다.
      // KOFIC 은 포스터를 주지 않으므로 박스오피스 쪽은 글자 카드로 그립니다.

      const PER_PAGE = 20;
      const MAX_PAGES = 3; // 20편 × 3페이지 = 한 탭 최대 60편

      const TYPES = ["전체", "영화", "드라마", "예능", "애니"];

      const CHIP =
        "seed-action-chip seed-action-chip--size_medium" +
        " seed-action-chip--layout_withText" +
        " seed-action-chip--size_medium-layout_withText";

      const FALLBACK =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'" +
        " viewBox='0 0 2 3'%3E%3Crect width='2' height='3' fill='%23eef1f5'/%3E%3C/svg%3E";

      const poster = (id) => (window.OTT_POSTERS || {})[id] || FALLBACK;

      /*
       * 이미지가 실패하면 회색 자리표시로 바꿉니다.
       *
       * 전에는 onerror 안에 data URI 를 그대로 적었는데, 그 주소에
       * 작은따옴표가 들어 있어(xmlns='...') 핸들러가 중간에 끊겼습니다.
       * 이미지가 실패할 때만 실행되는 코드라 오래 드러나지 않았습니다.
       * 이름 있는 함수로 두면 따옴표 문제가 생기지 않습니다.
       */
      window.ottImgFail = (el) => {
        el.onerror = null;
        el.src = FALLBACK;
      };
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      // 예매 링크는 데이터 파일에서 오므로, 상세 페이지와 같은 방식으로
      // https 인지와 호스트가 목록에 있는지를 확인한 뒤에만 겁니다.
      const CINEMA_HOSTS = new Set([
        "cgv.co.kr",
        "www.megabox.co.kr",
        "www.lottecinema.co.kr",
      ]);
      const MAL_HOSTS = new Set(["myanimelist.net", "www.myanimelist.net"]);
      const safe = (raw, allow) => {
        try {
          const u = new URL(raw);
          return u.protocol === "https:" && allow.has(u.hostname) ? u.href : "";
        } catch {
          return "";
        }
      };

      let DATA = null;
      let RANKS = new Map(); // 제목 → 지금 박스오피스 순위
      let CINEMAS = []; // 예매 링크가 확인된 극장 체인
      let FRESH = false; // 박스오피스 집계가 예매를 권할 만큼 최근인가
      let active = "전체";
      let page = 1;

      /**
       * 집계일이 오래되면 예매 칩을 달지 않습니다.
       * 갱신 워크플로가 멈춘 채로 두면 이미 내려간 영화에 예매 링크가
       * 계속 붙게 되는데, 그건 사실이 아닌 안내가 됩니다.
       */
      const STALE_DAYS = 10;
      function isRecentDate(raw, days = STALE_DAYS) {
        const m = String(raw || "").match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
        if (!m) return false;
        const then = Date.UTC(+m[1], +m[2] - 1, +m[3]);
        const now = new Date();
        const today = Date.UTC(
          now.getUTCFullYear(),
          now.getUTCMonth(),
          now.getUTCDate(),
        );
        const age = (today - then) / 86400000;
        return age >= 0 && age <= days;
      }

      function isFresh(latestDt) {
        return isRecentDate(latestDt, STALE_DAYS);
      }

      /** "20260916" 또는 "2026-09-16" → "9월 16일 개봉" */
      function opened(raw) {
        const m = String(raw || "").match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
        return m ? `${+m[2]}월 ${+m[3]}일 개봉` : "";
      }

      /** 403897 → "누적 40만". 만 단위 아래는 반올림해 읽기 쉽게 둡니다. */
      function audience(n) {
        if (!n || n < 10000) return "";
        const man = Math.round(n / 10000);
        return man >= 10000
          ? `누적 ${(man / 10000).toFixed(1)}억`
          : `누적 ${man}만`;
      }

      /** 제목 비교용. 공백과 문장부호를 떼고 맞춥니다. */
      const key = (t) =>
        String(t || "")
          .toLowerCase()
          .replace(/[^0-9a-z가-힣]/g, "");

      /**
       * 포스터가 없는 카드의 바탕색을 고릅니다.
       * movieCd 를 섞어 여섯 가지 중 하나로 보내, 목록이 한 가지 색으로
       * 깔리지 않게 합니다. 같은 작품은 늘 같은 색이 나옵니다.
       */
      const TINTS = 6;
      function tint(seed) {
        let h = 0;
        for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) % 9973;
        return h % TINTS;
      }

      /**
       * 이미지 위에 얹는 반투명 칩. "왜 실렸는가"를 카드 아래 글줄로 적는 대신
       * 그림 위에 한 번만 보여 줍니다.
       * 박스오피스는 마지막 집계일 순위가 3위 안일 때만 답니다.
       * KOFIC 순위는 관객수 기준이라 "예매율"이 아니라 "박스오피스"로 적습니다.
       */
      const TOP_N = 3;

      /**
       * 지금 차트 3위 안이면 그 순위를, 아니면 편집 근거를 씁니다.
       * 손으로 고른 작품이 지금 차트에도 있으면 옛 문구 대신 오늘 순위를 씁니다.
       */
      function credit(title, fallback) {
        const r = FRESH ? RANKS.get(key(title)) : null;
        return r && r <= TOP_N ? `국내 박스오피스 ${r}위` : fallback || "";
      }

      /** 카드 하나에 붙는 태그 수. 넘치면 뒤쪽은 버립니다. */
      const MAX_TAGS = 3;

      /**
       * 태그는 "왜 실렸는가"를 말합니다. 장르가 아닙니다.
       * 장르는 제목 바로 아래 부제 자리에 늘 따로 적습니다.
       *
       * 전에는 이 정보가 카드 종류마다 다른 자리에 있었습니다.
       * 포스터 카드는 그림 위 칩, 글자 카드는 판 위에 장르와 나란히,
       * 애니는 그림 위 평점. 같은 줄에 다른 종류가 와서 읽히지 않았습니다.
       * 한 자리로 모읍니다.
       */
      function tagRow(tags) {
        const shown = tags.filter(Boolean).slice(0, MAX_TAGS);
        if (!shown.length) return "";
        return (
          `<div class="tags">` +
          shown.map((t) => `<span class="tag">#${esc(t)}</span>`).join("") +
          `</div>`
        );
      }

      /** 제공처와 분류를 합쳐 한 태그로. "넷플릭스" + 드라마 → "넷플릭스 시리즈" */
      const KIND = { 드라마: "시리즈", 예능: "예능", 영화: "영화", 애니: "애니" };
      function providerTag(w) {
        const name = (w.watch || [])[0]?.name;
        if (!name) return "";
        const kind = KIND[w.type];
        return kind ? `${name} ${kind}` : name;
      }

      function badge(text) {
        return (
          `<span class="seed-badge__root seed-badge__root--size_medium` +
          ` seed-badge__root--variant_weak` +
          ` seed-badge__root--tone_neutral-variant_weak">` +
          `<span class="seed-badge__label">${esc(text)}</span></span>`
        );
      }

      /** 손으로 고른 작품 — 포스터가 있고 상세 페이지로 넘어갑니다. */
      function pickedCard(w) {
        // 분류는 탭이 이미 말하므로, 전체 탭에서만 함께 적습니다.
        const line = active === "전체" ? `${w.type} · ${w.genre}` : w.genre;
        const tags = [credit(w.title, w.pickedBy), providerTag(w)];
        return (
          `<a class="card" href="content-detail.html?id=${encodeURIComponent(w.id)}">` +
          `<span class="thumb">` +
          `<img src="${poster(w.id)}" alt="${esc(w.title)} 포스터" loading="lazy"` +
          ` referrerpolicy="no-referrer" onerror="ottImgFail(this)">` +
          `</span>` +
          `<div class="cb"><b>${esc(w.title)}</b>` +
          `<span class="genre">${esc(line)}</span>` +
          tagRow(tags) +
          `</div></a>`
        );
      }

      /**
       * MyAnimeList 에서 온 애니.
       * 상세 페이지가 없으므로 카드 전체를 링크로 만들지 않고,
       * 다른 카드처럼 아래 액션 줄에 출처 링크를 둡니다.
       */
      /**
       * 박스오피스에서 온 작품.
       * 상세 페이지가 없으므로 카드 전체를 링크로 만들지 않습니다.
       */
      function boxCard(m) {
        // 장르는 늘 부제 자리에 둡니다. 태그와 섞지 않습니다.
        const rest =
          active === "애니"
            ? m.genres.filter((g) => g !== "애니메이션")
            : m.genres;
        // 개봉일은 작품 정보라 부제 줄에 둡니다.
        const line = [
          active === "전체" ? m.type : "",
          rest.join(" · "),
          opened(m.openedAt),
        ]
          .filter(Boolean)
          .join(" · ");

        // 태그는 "왜 실렸는가" 만 담습니다.
        const tags = [credit(m.title, ""), audience(m.audienceAcc)];

        // 예매는 하위 항목입니다. 카드의 주된 내용이 아니라, 지금 극장에
        // 걸려 있을 때만 딸려 붙는 행동입니다.
        const book =
          m.showing && FRESH && CINEMAS.length
            ? `<div class="sub-action"><span class="sub-action-label">예매</span>` +
              CINEMAS.map(
                (c) =>
                  `<a class="${CHIP} book-chip" href="${c.href}"` +
                  ` target="_blank" rel="noopener noreferrer"` +
                  ` title="${esc(c.name)} 예매 페이지로 이동합니다">` +
                  `${esc(c.short)}</a>`,
              ).join("") +
              `</div>`
            : "";

        const body =
          `<div class="cb"><b>${esc(m.title)}</b>` +
          (line ? `<span class="genre">${esc(line)}</span>` : "") +
          tagRow(tags) +
          `</div>` + book;

        if (m.poster) {
          return (
            `<article class="card">` +
            `<span class="thumb">` +
            `<img src="${esc(m.poster)}" alt="${esc(m.title)} 포스터" loading="lazy"` +
            ` onerror="ottImgFail(this)">` +
            `</span>` + body +
            `</article>`
          );
        }

        // 포스터가 아직 없으면 제목을 판 한가운데 앉힌 글자 카드로 둡니다.
        return (
          `<article class="card card--text">` +
          `<div class="panel panel--t${tint(m.movieCd)}">` +
          `<b class="panel-title">${esc(m.title)}</b>` +
          `</div>` + body +
          `</article>`
        );
      }

      /**
       * MyAnimeList 에서 온 애니.
       * 상세 페이지가 없으므로 카드 전체를 링크로 만들지 않습니다.
       */
      function animeCard(a) {
        // 장르는 늘 부제 자리에 둡니다. 태그와 섞지 않습니다.
        // 화수·제작사는 작품 정보라 부제 줄에 둡니다.
        const line = [
          active === "전체" ? "애니" : "",
          a.genres.join(" · "),
          a.episodes ? `${a.episodes}화` : "",
          a.studio,
        ]
          .filter(Boolean)
          .join(" · ");

        // 태그는 "왜 실렸는가" 만 담습니다.
        // 평점·분기 화제성은 MAL 이 공개한 사실이라 여기에 해당합니다.
        const tags = [
          "이번 분기 화제작",
          a.score ? `MAL 평점 ${a.score}` : "",
        ];

        const href = safe(a.malUrl, MAL_HOSTS);
        const link = href
          ? `<div class="sub-action">` +
            `<span class="sub-action-label">출처</span>` +
            `<a class="${CHIP} book-chip" href="${href}"` +
            ` target="_blank" rel="noopener noreferrer"` +
            ` title="MyAnimeList 작품 페이지로 이동합니다">MyAnimeList</a>` +
            `</div>`
          : "";

        const body =
          `<div class="cb"><b>${esc(a.title)}</b>` +
          (line ? `<span class="genre">${esc(line)}</span>` : "") +
          tagRow(tags) +
          `</div>` + link;

        if (a.poster) {
          return (
            `<article class="card">` +
            `<span class="thumb">` +
            `<img src="${esc(a.poster)}" alt="${esc(a.title)} 포스터" loading="lazy"` +
            ` onerror="ottImgFail(this)">` +
            `</span>` + body +
            `</article>`
          );
        }

        return (
          `<article class="card card--text">` +
          `<div class="panel panel--t${tint(String(a.malId))}">` +
          `<b class="panel-title">${esc(a.title)}</b>` +
          `</div>` + body +
          `</article>`
        );
      }

      /** TMDB에서 자동 수집한 드라마/예능. Claude의 통합 카드 규칙을 따릅니다. */
      function tmdbCard(w) {
        const line = [
          active === "전체" ? w.type : "",
          w.firstAirDate ? `${w.firstAirDate} 첫 방송` : "",
        ]
          .filter(Boolean)
          .join(" · ");
        const tags = [w.rank ? `TMDB 인기 ${w.rank}위` : "TMDB 인기"];

        const body =
          `<div class="cb"><b>${esc(w.title)}</b>` +
          (line ? `<span class="genre">${esc(line)}</span>` : "") +
          tagRow(tags) +
          `</div>`;

        if (w.poster) {
          return (
            `<article class="card">` +
            `<span class="thumb">` +
            `<img src="${esc(w.poster)}" alt="${esc(w.title)} 포스터" loading="lazy"` +
            ` referrerpolicy="no-referrer" onerror="ottImgFail(this)">` +
            `</span>` + body +
            `</article>`
          );
        }

        return (
          `<article class="card card--text">` +
          `<div class="panel panel--t${tint(String(w.tmdbId))}">` +
          `<b class="panel-title">${esc(w.title)}</b>` +
          `</div>` + body +
          `</article>`
        );
      }

      /** 지금 탭에 보여 줄 작품 전체. 자동 데이터가 있으면 우선 사용합니다. */
      function pool() {
        const anime = (DATA.anime || []).map((a) => ({ kind: "anime", a }));
        const autoTv = (DATA.tv || []).map((w) => ({ kind: "tmdb", w }));

        // 애니 탭은 MyAnimeList 에서만 채웁니다.
        // "극장 개봉" 이 아니라 "지금 화제인 애니" 기준이라, KOFIC 의
        // 극장 애니메이션은 영화 탭에 둡니다(장르 표기로 구분됩니다).
        if (active === "애니") return anime;

        const picked = DATA.works
          .filter((w) => active === "전체" || w.type === active)
          .map((w) => ({ kind: "picked", w }));

        // 드라마/예능은 자동 데이터를 우선 사용하되, TMDB에 없는 수동 큐레이션을
        // 위해 자동 목록이 60개를 채운 경우에도 최대 5칸을 fallback으로 보장합니다.
        if (active === "드라마" || active === "예능") {
          const auto = autoTv.filter((x) => x.w.type === active);
          const autoSeen = new Set(auto.map((x) => key(x.w.title)));
          const manual = picked.filter((x) => !autoSeen.has(key(x.w.title)));
          const limit = PER_PAGE * MAX_PAGES;

          if (auto.length < limit) {
            return [...auto, ...manual.slice(0, limit - auto.length)];
          }
          const reserve = Math.min(5, manual.length);
          return [
            ...auto.slice(0, limit - reserve),
            ...manual.slice(0, reserve),
          ];
        }

        // 같은 작품이 양쪽에 있으면 포스터와 상세가 있는 쪽을 남깁니다.
        const seen = new Set(picked.map((x) => key(x.w.title)));
        const box = (DATA.boxoffice || [])
          .filter(
            (m) =>
              (active === "전체" || m.type === active) && !seen.has(key(m.title)),
          )
          // 지금 극장에 걸려 있는 작품을 앞에 둡니다. 예매할 수 있는 쪽이
          // 먼저 보여야 목록이 쓸모가 있습니다.
          .sort((a, b) => Number(b.showing) - Number(a.showing))
          .map((m) => ({ kind: "box", m }));

        if (active !== "전체") return [...picked, ...box];

        // 전체 탭은 60건에서 잘립니다. 출처를 이어 붙이면 뒤쪽 출처가
        // 한 건도 안 보이므로 번갈아 섞습니다.
        const pickedSeen = new Set(picked.map((x) => key(x.w.title)));
        const tv = autoTv.filter((x) => !pickedSeen.has(key(x.w.title)));
        const lanes = [picked, box, anime, tv];
        const mixed = [];
        const total = lanes.reduce((sum, lane) => sum + lane.length, 0);
        for (let i = 0; mixed.length < total; i += 1) {
          for (const lane of lanes) if (lane[i]) mixed.push(lane[i]);
        }
        return mixed;
      }

      function pager(pages) {
        if (pages < 2) return "";
        const btn = (n) =>
          `<button class="${CHIP} page-btn" data-page="${n}"` +
          ` aria-current="${n === page ? "page" : "false"}">${n}</button>`;
        return (
          `<nav class="pager" aria-label="페이지 넘기기">` +
          Array.from({ length: pages }, (_, i) => btn(i + 1)).join("") +
          `</nav>`
        );
      }

      function render() {
        // 탭 안에는 그 분류의 작품만 놓습니다. 시청 경로는 카드가 직접
        // 표시하므로(넷플릭스 등) status 로 다시 묶지 않습니다.
        const all = pool();
        const capped = all.slice(0, PER_PAGE * MAX_PAGES);
        const pages = Math.max(1, Math.ceil(capped.length / PER_PAGE));
        if (page > pages) page = 1;

        const shown = capped.slice((page - 1) * PER_PAGE, page * PER_PAGE);
        const host = document.querySelector("#sections");

        if (!shown.length) {
          document.querySelector("#count").textContent = `${active} 0건`;
          host.innerHTML = `<p class="empty">${esc(active)} 분류는 아직 준비 중입니다.</p>`;
          return;
        }

        // 건수는 탭 줄 오른쪽 한 곳에서만 말합니다.
        // 잘린 경우에만 몇 건을 보여 주는지 덧붙입니다.
        document.querySelector("#count").textContent =
          all.length > capped.length
            ? `${active} ${all.length}건 중 ${capped.length}건`
            : `${active} ${all.length}건`;

        host.innerHTML =
          `<div class="grid">` +
          shown
            .map((x) =>
              x.kind === "picked"
                ? pickedCard(x.w)
                : x.kind === "box"
                  ? boxCard(x.m)
                  : x.kind === "anime"
                    ? animeCard(x.a)
                    : tmdbCard(x.w),
            )
            .join("") +
          `</div>` +
          pager(pages);

        host.querySelectorAll(".page-btn").forEach((b) => {
          b.onclick = () => {
            page = Number(b.dataset.page);
            render();
            toTop();
          };
        });
      }

      /**
       * 목록 맨 위(탭 줄)로 돌아갑니다. 이미 위에 있으면 움직이지 않습니다.
       * 사이트 전역은 scroll-behavior:smooth 지만 여기서는 즉시 옮깁니다.
       * 탭을 누른 뒤 1000px 을 훑어 내려가는 동안 화면이 흔들려 보입니다.
       */
      function toTop() {
        const f = document.querySelector(".filters");
        if (f.getBoundingClientRect().top < 0) {
          f.scrollIntoView({ block: "start", behavior: "instant" });
        }
      }

      function tabs() {
        const host = document.querySelector(".filters");
        host.innerHTML = TYPES.map(
          (t) =>
            `<button class="${CHIP}" role="tab" data-type="${esc(t)}"` +
            ` aria-selected="${t === active}">${esc(t)}</button>`,
        ).join("");
        host.querySelectorAll("button").forEach((b) => {
          b.onclick = () => {
            active = b.dataset.type;
            page = 1;
            host.querySelectorAll("button").forEach((x) =>
              x.setAttribute("aria-selected", String(x === b)),
            );
            render();
            // 탭마다 목록 길이가 달라, 스크롤한 채로 탭을 바꾸면 화면이
            // 제각각인 위치에 떨어집니다. 늘 같은 자리에서 시작하게 합니다.
            toTop();
          };
        });
      }

      // 박스오피스와 예매 링크는 없어도 페이지가 뜨도록 따로 받습니다.
      // 손으로 고른 작품만 있어도 목록은 성립하기 때문입니다.
      const optional = (url) =>
        fetch(url)
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);

      Promise.all([
        fetch("assets/content-data.json").then((r) => r.json()),
        optional("assets/boxoffice.json"),
        optional("assets/cinema-links.json"),
        optional("assets/anime.json"),
        optional("assets/tv-ranking.json"),
      ])
        .then(([d, box, cinema, anime, tv]) => {
          DATA = d;
          DATA.boxoffice = Array.isArray(box?.movies) ? box.movies : [];
          DATA.anime = Array.isArray(anime?.works) ? anime.works : [];
          const tvFresh = isRecentDate(tv?.updatedAt, 14);
          DATA.tv = tvFresh
            ? [
                ...(Array.isArray(tv?.drama) ? tv.drama : []),
                ...(Array.isArray(tv?.variety) ? tv.variety : []),
              ]
            : [];
          FRESH = isFresh(box?.latestDt);
          // 손으로 고른 작품이 지금 차트에도 있으면 그 순위를 씁니다.
          // 같은 작품에 옛 근거 문구와 오늘 순위가 따로 놀지 않도록.
          for (const m of DATA.boxoffice) {
            if (m.rank) RANKS.set(key(m.title), m.rank);
          }
          CINEMAS = (cinema?.chains || [])
            .map((c) => ({
              name: c.name,
              // short 가 없으면 전체 이름을 씁니다. 줄이 넘칠 뿐 링크는 삽니다.
              short: c.short || c.name,
              href: safe(c.bookingUrl, CINEMA_HOSTS),
            }))
            .filter((c) => c.href);

          // 포스터 출처를 방침 안내에 함께 적습니다. 어디서 온 이미지인지
          // 밝히지 않으면 출처 표기 없이 남의 이미지를 싣는 셈이 됩니다.
          const sources = [
            ...new Set(
              [...DATA.boxoffice, ...DATA.anime, ...DATA.tv]
                .map((x) => x.posterCredit)
                .filter(Boolean),
            ),
          ];
          document.querySelector("#policy-text").textContent =
            `${d.selectionPolicy} ${d.watchNote} 확인일 ${d.checkedAt}.` +
            (anime?.rankedBy ? ` 애니는 ${anime.rankedBy}입니다.` : "") +
            (tvFresh && tv?.rankedBy ? ` 드라마·예능은 ${tv.rankedBy}입니다.` : "") +
            (sources.length ? ` 포스터 출처: ${sources.join(", ")}.` : "");
          document.querySelector("#partner-text").textContent =
            d.partnerDisclosure;
          tabs();
          render();
        })
        .catch(() => {
          document.querySelector("#sections").innerHTML =
            '<p class="empty">작품 정보를 불러오지 못했습니다.</p>';
        });
    </script>
  </body>
</html>
