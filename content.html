    <script>
      // 작품 목록은 두 곳에서 옵니다.
      //   content-data.json — 손으로 고른 작품. 포스터와 상세 페이지가 있습니다.
      //   boxoffice.json    — KOFIC 일별 박스오피스를 누적한 목록. 포스터가 없습니다.
      // KOFIC 은 포스터를 주지 않으므로 박스오피스 쪽은 글자 카드로 그립니다.

      /*
       * 한 화면 20장, 최대 3페이지 = 한 탭 60건.
       *
       * 왜 60인가:
       *  - 분류 탭은 이 안에 다 들어갑니다. 지금 영화 41 / 드라마 45 /
       *    예능 60 / 애니 40 건이라 잘리는 탭이 없습니다.
       *  - 포스터가 한 장에 40~70KB 이고 lazy 로 받으므로 한 페이지가
       *    1MB 안쪽입니다.
       *  - 전체 탭만 넘칩니다. 넷을 고르게 섞은 맛보기라 그렇게 둡니다.
       * 분류 탭 하나가 60을 넘기 시작하면 MAX_PAGES 를 올려야 합니다.
       */
      const PER_PAGE = 20;
      const MAX_PAGES = 3;

      const TYPES = ["전체", "영화", "드라마", "예능", "애니"];

      const CHIP =
        "seed-action-chip seed-action-chip--size_medium" +
        " seed-action-chip--layout_withText" +
        " seed-action-chip--size_medium-layout_withText";

      const FALLBACK =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'" +
        " viewBox='0 0 2 3'%3E%3Crect width='2' height='3' fill='%23eef1f5'/%3E%3C/svg%3E";

      const poster = (id) => (window.OTT_POSTERS || {})[id] || FALLBACK;

      /*
       * 이미지가 실패하면 회색 자리표시로 바꿉니다.
       *
       * 전에는 onerror 안에 data URI 를 그대로 적었는데, 그 주소에
       * 작은따옴표가 들어 있어(xmlns='...') 핸들러가 중간에 끊겼습니다.
       * 이미지가 실패할 때만 실행되는 코드라 오래 드러나지 않았습니다.
       * 이름 있는 함수로 두면 따옴표 문제가 생기지 않습니다.
       */
      window.ottImgFail = (el) => {
        el.onerror = null;
        el.src = FALLBACK;
      };
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      // 바깥으로 나가는 링크는 https 인지와 호스트가 목록에 있는지를
      // 확인한 뒤에만 겁니다.
      let DATA = null;
      let RANKS = new Map(); // 제목 → 지금 박스오피스 순위
      let FRESH = false; // 박스오피스 집계가 순위를 말할 만큼 최근인가
      let active = "전체";
      let page = 1;

      /**
       * 집계일이 오래되면 순위 태그를 달지 않습니다.
       * 갱신 워크플로가 멈춘 채로 두면 이미 내려간 영화에 "박스오피스
       * 1위" 가 계속 붙게 되는데, 그건 사실이 아닌 안내가 됩니다.
       */
      const STALE_DAYS = 10;

      /** 날짜가 오늘로부터 days 일 안쪽인가. 미래 날짜는 항상 거짓입니다. */
      function isRecentDate(raw, days) {
        const m = String(raw || "").match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
        if (!m) return false;
        const then = Date.UTC(+m[1], +m[2] - 1, +m[3]);
        const now = new Date();
        const today = Date.UTC(
          now.getUTCFullYear(),
          now.getUTCMonth(),
          now.getUTCDate(),
        );
        const age = (today - then) / 86400000;
        return age >= 0 && age <= days;
      }

      function isFresh(latestDt) {
        return isRecentDate(latestDt, STALE_DAYS);
      }

      /*
       * 날짜 한 조각을 뽑아 "9월 16일 개봉" 으로 만듭니다.
       *
       * 들어오는 모양이 출처마다 다릅니다.
       *   KOFIC        20260916
       *   TMDB         2026-09-16
       *   손으로 적은 것  "2026.07.29 국내 개봉" 또는 "2026"
       * 연도만 있으면 날짜가 아니므로 비웁니다. 부제 줄에 "2026" 만
       * 떠 있으면 아무것도 알려 주지 않습니다.
       */
      function opened(raw, suffix = "개봉") {
        const m = String(raw || "").match(/(\d{4})[-.]?(\d{2})[-.]?(\d{2})/);
        return m ? `${+m[2]}월 ${+m[3]}일 ${suffix}` : "";
      }

      /** 403897 → "누적 40만". 만 단위 아래는 반올림해 읽기 쉽게 둡니다. */
      function audience(n) {
        if (!n || n < 10000) return "";
        const man = Math.round(n / 10000);
        return man >= 10000
          ? `누적 ${(man / 10000).toFixed(1)}억`
          : `누적 ${man}만`;
      }

      /** 제목 비교용. 공백과 문장부호를 떼고 맞춥니다. */
      const key = (t) =>
        String(t || "")
          .toLowerCase()
          .replace(/[^0-9a-z가-힣]/g, "");

      /**
       * 포스터가 없는 카드의 바탕색을 고릅니다.
       * movieCd 를 섞어 여섯 가지 중 하나로 보내, 목록이 한 가지 색으로
       * 깔리지 않게 합니다. 같은 작품은 늘 같은 색이 나옵니다.
       */
      const TINTS = 6;
      function tint(seed) {
        let h = 0;
        for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) % 9973;
        return h % TINTS;
      }

      /**
       * 이미지 위에 얹는 반투명 칩. "왜 실렸는가"를 카드 아래 글줄로 적는 대신
       * 그림 위에 한 번만 보여 줍니다.
       * 박스오피스는 마지막 집계일 순위가 3위 안일 때만 답니다.
       * KOFIC 순위는 관객수 기준이라 "예매율"이 아니라 "박스오피스"로 적습니다.
       */
      const TOP_N = 3;

      /**
       * 지금 차트 3위 안이면 그 순위를, 아니면 편집 근거를 씁니다.
       * 손으로 고른 작품이 지금 차트에도 있으면 옛 문구 대신 오늘 순위를 씁니다.
       */
      function credit(title, fallback) {
        const r = FRESH ? RANKS.get(key(title)) : null;
        return r && r <= TOP_N ? `국내 박스오피스 ${r}위` : fallback || "";
      }

      /*
       * 부제 한 줄의 규칙. 카드 종류와 상관없이 셋만 씁니다.
       *
       *   대분류(굵게) · 소분류 · 날짜
       *   영화 · 액션 · 8월 26일 개봉
       *
       * 대분류는 이 카드가 어느 탭에서 추려진 것인지 말합니다. 전체 탭에서
       * 무엇이 섞여 있는지 알 수 있어야 해서 늘 적고, 굵게 둬서 줄의
       * 시작점을 잡습니다. 소분류는 장르 하나만 씁니다.
       *
       * 전에는 장르를 있는 대로 이어 붙여 "영화 · 액션 · 어드벤처 ·
       * 미스터리 · SF · 스릴러 · 8월 26일 개봉" 처럼 두 줄이 됐고,
       * 그래서 아무것도 읽히지 않았습니다.
       */
      function metaLine(type, genre, when) {
        // "드라마 · 드라마" 처럼 같은 말이 두 번 나오지 않게 합니다.
        const sub = genre && genre !== type ? genre : "";

        /*
         * 조각마다 태그를 나눠 둡니다. 가운뎃점은 CSS 의 ::after 로
         * 앞 조각에 붙여서, 좁은 화면에서 줄이 바뀔 때 "· 액션" 처럼
         * 점이 다음 줄 맨 앞에 떨어지지 않게 합니다.
         */
        return (
          `<span class="genre"><b>${esc(type)}</b>` +
          [sub, when]
            .filter(Boolean)
            .map((x) => `<span>${esc(x)}</span>`)
            .join("") +
          `</span>`
        );
      }

      /*
       * TMDB 는 TV 장르를 번호로 줍니다. 부제 줄에 "18" 을 적을 수는
       * 없으니 여기서 한글 이름으로 바꿉니다.
       * 목록에 없는 번호는 버립니다 — 모르는 번호를 그대로 찍는 것보다
       * 비워 두는 편이 낫습니다.
       */
      const TMDB_TV_GENRE = {
        10759: "액션",
        16: "애니메이션",
        35: "코미디",
        80: "범죄",
        99: "다큐",
        18: "드라마",
        10751: "가족",
        10762: "어린이",
        9648: "미스터리",
        10763: "뉴스",
        10764: "리얼리티",
        10765: "SF·판타지",
        10766: "일일드라마",
        10767: "토크",
        10768: "시사·교양",
        37: "서부",
      };

      /** 장르 목록에서 대표 하나만. 분류와 겹치는 이름은 건너뜁니다. */
      function mainGenre(list, type) {
        const skip = new Set([type, "애니메이션", "드라마", "영화"]);
        const picked = (list || []).find((g) => g && !skip.has(g));
        return picked || (list || [])[0] || "";
      }

      /** 카드 하나에 붙는 태그 수. 넘치면 뒤쪽은 버립니다. */
      const MAX_TAGS = 3;

      /**
       * 태그는 "왜 실렸는가"를 말합니다. 장르가 아닙니다.
       * 장르는 제목 바로 아래 부제 자리에 늘 따로 적습니다.
       *
       * 전에는 이 정보가 카드 종류마다 다른 자리에 있었습니다.
       * 포스터 카드는 그림 위 칩, 글자 카드는 판 위에 장르와 나란히,
       * 애니는 그림 위 평점. 같은 줄에 다른 종류가 와서 읽히지 않았습니다.
       * 한 자리로 모읍니다.
       */
      function tagRow(tags) {
        const shown = tags.filter(Boolean).slice(0, MAX_TAGS);
        if (!shown.length) return "";
        return (
          `<div class="tags">` +
          shown.map((t) => `<span class="tag">#${esc(t)}</span>`).join("") +
          `</div>`
        );
      }

      function badge(text) {
        return (
          `<span class="seed-badge__root seed-badge__root--size_medium` +
          ` seed-badge__root--variant_weak` +
          ` seed-badge__root--tone_neutral-variant_weak">` +
          `<span class="seed-badge__label">${esc(text)}</span></span>`
        );
      }

      function netflixSeriesTag(w) {
        if (w.type !== "드라마") return "";
        const manualNetflix = (w.watch || []).some((x) =>
          /netflix|넷플릭스/i.test(String(x.name || "")),
        );
        const autoNetflix = (w.providers || []).some((x) =>
          /netflix|넷플릭스/i.test(String(x)),
        );
        return manualNetflix || autoNetflix ? "넷플릭스 시리즈" : "";
      }

      /** 손으로 고른 작품 — 포스터가 있고 상세 페이지로 넘어갑니다. */
      function pickedCard(w) {
        const genre = String(w.genre || "").split(" · ")[0];
        // 제공처는 선정 이유가 아니므로 태그에서 빼고, 수동 큐레이션은
        // 모든 카드가 최소 한 가지 선정 근거를 갖도록 합니다.
        const tags = [
          credit(w.title, w.pickedBy || "에디터 선정"),
          netflixSeriesTag(w),
        ];
        return (
          `<a class="card" href="content-detail.html?id=${encodeURIComponent(w.id)}">` +
          `<span class="thumb">` +
          `<img src="${poster(w.id)}" alt="${esc(w.title)} 포스터" loading="lazy"` +
          ` referrerpolicy="no-referrer" onerror="ottImgFail(this)">` +
          `</span>` +
          `<div class="cb"><b>${esc(w.title)}</b>` +
          metaLine(w.type, genre, opened(w.releasedAt)) +
          tagRow(tags) +
          `</div></a>`
        );
      }

      /**
       * MyAnimeList 에서 온 애니.
       * 상세 페이지가 없으므로 카드 전체를 링크로 만들지 않고,
       * 다른 카드처럼 아래 액션 줄에 출처 링크를 둡니다.
       */
      /**
       * 박스오피스에서 온 작품.
       * 상세 페이지가 없으므로 카드 전체를 링크로 만들지 않습니다.
       */
      function boxCard(m) {
        // 태그는 "왜 실렸는가" 만 담습니다.
        const tags = [credit(m.title, ""), audience(m.audienceAcc)];

        const body =
          `<div class="cb"><b>${esc(m.title)}</b>` +
          metaLine(m.type, mainGenre(m.genres, m.type), opened(m.openedAt)) +
          tagRow(tags) +
          `</div>`;

        if (m.poster) {
          return (
            `<a class="card" href="content-detail.html?id=${encodeURIComponent(`kofic-${m.movieCd}`)}">` +
            `<span class="thumb">` +
            `<img src="${esc(m.poster)}" alt="${esc(m.title)} 포스터" loading="lazy"` +
            ` onerror="ottImgFail(this)">` +
            `</span>` + body +
            `</a>`
          );
        }

        // 포스터가 아직 없으면 제목을 판 한가운데 앉힌 글자 카드로 둡니다.
        return (
          `<a class="card card--text" href="content-detail.html?id=${encodeURIComponent(`kofic-${m.movieCd}`)}">` +
          `<div class="panel panel--t${tint(m.movieCd)}">` +
          `<b class="panel-title">${esc(m.title)}</b>` +
          `</div>` + body +
          `</a>`
        );
      }

      /**
       * MyAnimeList 에서 온 애니.
       * 상세 페이지가 없으므로 카드 전체를 링크로 만들지 않습니다.
       */
      function animeCard(a) {
        // 태그는 "왜 실렸는가" 만 담습니다.
        // 평점·분기 화제성은 MAL 이 공개한 사실이라 여기에 해당합니다.
        /*
         * 태그 하나만 씁니다.
         *
         * "지금 방영 중" 을 같이 달았더니 뒤 태그가 밀려 "#AniList ..."
         * 로 잘렸습니다. 아무것도 알려 주지 않는 칩이 하나 생긴 셈입니다.
         * 게다가 이 탭은 전부 방영 중인 작품이라 그 말은 카드마다
         * 같은 소리입니다. 카드를 구분해 주는 것은 평점 쪽입니다.
         *
         * 어디서 온 평점인지는 항목이 들고 옵니다(AniList / MyAnimeList).
         */
        const tags = [
          a.score ? `평점 ${a.score}` : "지금 방영 중",
        ];

        const body =
          `<div class="cb"><b>${esc(a.title)}</b>` +
          metaLine(
            "애니",
            mainGenre(a.genres, "애니"),
            a.episodes ? `${a.episodes}화` : "",
          ) +
          tagRow(tags) +
          `</div>`;

        if (a.poster) {
          return (
            `<a class="card" href="content-detail.html?id=${encodeURIComponent(`anime-${a.malId}`)}">` +
            `<span class="thumb">` +
            `<img src="${esc(a.poster)}" alt="${esc(a.title)} 포스터" loading="lazy"` +
            ` onerror="ottImgFail(this)">` +
            `</span>` + body +
            `</a>`
          );
        }

        return (
          `<a class="card card--text" href="content-detail.html?id=${encodeURIComponent(`anime-${a.malId}`)}">` +
          `<div class="panel panel--t${tint(String(a.malId))}">` +
          `<b class="panel-title">${esc(a.title)}</b>` +
          `</div>` + body +
          `</a>`
        );
      }

      /*
       * TMDB 에서 자동으로 받은 드라마·예능.
       * 상세 페이지가 없으므로 카드 전체를 링크로 만들지 않습니다.
       */
      function tmdbCard(w) {
        const genre = TMDB_TV_GENRE[(w.genres || [])[0]] || "";

        /*
         * 날짜 자리는 "언제 볼 수 있나" 로 채웁니다.
         *   다음 방송일이 있으면  9월 23일 방송
         *   없고 최근에 시작했으면 9월 18일 첫 방송
         * 라디오스타처럼 2007년에 시작한 장수 프로그램은 첫 방송일이
         * 아무것도 알려 주지 않으므로 비웁니다.
         */
        const when = w.nextAirDate
          ? opened(w.nextAirDate, "방송")
          : isRecentDate(w.firstAirDate, 365)
            ? opened(w.firstAirDate, "첫 방송")
            : "";

        const tags = [
          w.rank ? `인기 ${w.rank}위` : "인기",
          netflixSeriesTag(w),
        ];

        const body =
          `<div class="cb"><b>${esc(w.title)}</b>` +
          metaLine(w.type, genre, when) +
          tagRow(tags) +
          `</div>`;

        if (w.poster) {
          return (
            `<a class="card" href="content-detail.html?id=${encodeURIComponent(`tmdb-${w.tmdbId}`)}">` +
            `<span class="thumb">` +
            `<img src="${esc(w.poster)}" alt="${esc(w.title)} 포스터" loading="lazy"` +
            ` referrerpolicy="no-referrer" onerror="ottImgFail(this)">` +
            `</span>` + body +
            `</a>`
          );
        }

        return (
          `<a class="card card--text" href="content-detail.html?id=${encodeURIComponent(`tmdb-${w.tmdbId}`)}">` +
          `<div class="panel panel--t${tint(String(w.tmdbId))}">` +
          `<b class="panel-title">${esc(w.title)}</b>` +
          `</div>` + body +
          `</a>`
        );
      }

      /*
       * 지금 탭에 보여 줄 작품 전체.
       *
       * 출처는 넷입니다.
       *   picked  손으로 고른 작품 (content-data.json) — 상세 페이지가 있습니다
       *   box     KOFIC 박스오피스 (boxoffice.json)    — 영화
       *   tv      TMDB 한국 TV     (tv-ranking.json)   — 드라마·예능
       *   anime   MyAnimeList      (anime.json)        — 애니
       *
       * 분류 탭은 그 분류를 "다" 담습니다. 전체 탭은 넷을 고르게 섞은
       * 맛보기입니다. 이어 붙이면 앞 출처만 60칸을 다 먹고 뒤 출처가
       * 한 건도 안 보이기 때문입니다.
       */
      function pool() {
        const anime = (DATA.anime || []).map((a) => ({ kind: "anime", a }));

        // 애니 탭은 MyAnimeList 에서만 채웁니다.
        // "극장 개봉" 이 아니라 "지금 화제인 애니" 기준이라, KOFIC 의
        // 극장 애니메이션은 영화 탭에 둡니다(장르 표기로 구분됩니다).
        if (active === "애니") return anime;

        const picked = DATA.works
          .filter((w) => active === "전체" || w.type === active)
          .map((w) => ({ kind: "picked", w }));
        const pickedSeen = new Set(picked.map((x) => key(x.w.title)));

        // 자동으로 받은 드라마·예능. 손으로 고른 것과 겹치면 상세 페이지가
        // 있는 쪽을 남깁니다.
        const tv = (DATA.tv || [])
          .filter(
            (w) =>
              (active === "전체" || w.type === active) &&
              !pickedSeen.has(key(w.title)),
          )
          .map((w) => ({ kind: "tmdb", w }));

        const box = (DATA.boxoffice || [])
          .filter(
            (m) =>
              (active === "전체" || m.type === active) &&
              !pickedSeen.has(key(m.title)),
          )
          .sort((a, b) => Number(b.showing) - Number(a.showing))
          .map((m) => ({ kind: "box", m }));

        // 드라마·예능 탭은 자동 데이터가 주인공입니다. 손으로 고른 작품은
        // TMDB 에 없는 것들이라 뒤에 붙여 함께 남깁니다.
        if (active === "드라마" || active === "예능") return [...tv, ...picked];
        if (active !== "전체") return [...picked, ...box];

        return roundRobin([picked, box, tv, anime]);
      }

      /** 여러 줄에서 한 건씩 번갈아 꺼내 하나로 잇습니다. */
      function roundRobin(lanes) {
        const total = lanes.reduce((n, lane) => n + lane.length, 0);
        const out = [];
        for (let i = 0; out.length < total; i += 1) {
          for (const lane of lanes) if (lane[i]) out.push(lane[i]);
        }
        return out;
      }

      function pager(pages) {
        if (pages < 2) return "";
        const btn = (n) =>
          `<button class="${CHIP} page-btn" data-page="${n}"` +
          ` aria-current="${n === page ? "page" : "false"}">${n}</button>`;
        return (
          `<nav class="pager" aria-label="페이지 넘기기">` +
          Array.from({ length: pages }, (_, i) => btn(i + 1)).join("") +
          `</nav>`
        );
      }

      function render() {
        // 탭 안에는 그 분류의 작품만 놓습니다. 시청 경로는 카드가 직접
        // 표시하므로(넷플릭스 등) status 로 다시 묶지 않습니다.
        const all = pool();
        const capped = all.slice(0, PER_PAGE * MAX_PAGES);
        const pages = Math.max(1, Math.ceil(capped.length / PER_PAGE));
        if (page > pages) page = 1;

        const shown = capped.slice((page - 1) * PER_PAGE, page * PER_PAGE);
        const host = document.querySelector("#sections");

        if (!shown.length) {
          document.querySelector("#count").textContent =
            active === "전체" ? "전체 0건" : `${active} 상위 0건`;
          host.innerHTML = `<p class="empty">${esc(active)} 분류는 아직 준비 중입니다.</p>`;
          return;
        }

        /*
         * 건수는 탭 줄 오른쪽 한 곳에서만 말합니다.
         *
         * 전에는 "전체 64건 중 60건" 이었는데, 두 숫자가 각각 무엇인지
         * 읽는 사람이 알 길이 없었습니다. 화면에 실제로 있는 수만
         * 적고, 잘렸을 때만 어디로 가면 나머지를 볼 수 있는지 말합니다.
         */
        document.querySelector("#count").textContent =
          active === "전체"
            ? all.length <= capped.length
              ? `전체 ${capped.length}건`
              : `전체 ${capped.length}건 · 나머지는 분류 탭에서`
            : `${active} 상위 ${capped.length}건`;

        host.innerHTML =
          `<div class="cards grid">` +
          shown
            .map((x) =>
              x.kind === "picked"
                ? pickedCard(x.w)
                : x.kind === "box"
                  ? boxCard(x.m)
                  : x.kind === "anime"
                    ? animeCard(x.a)
                    : tmdbCard(x.w),
            )
            .join("") +
          `</div>` +
          pager(pages);

        host.querySelectorAll(".page-btn").forEach((b) => {
          b.onclick = () => {
            page = Number(b.dataset.page);
            render();
            toTop();
          };
        });
      }

      /**
       * 목록 맨 위(탭 줄)로 돌아갑니다. 이미 위에 있으면 움직이지 않습니다.
       * 사이트 전역은 scroll-behavior:smooth 지만 여기서는 즉시 옮깁니다.
       * 탭을 누른 뒤 1000px 을 훑어 내려가는 동안 화면이 흔들려 보입니다.
       */
      function toTop() {
        const f = document.querySelector(".filters");
        if (f.getBoundingClientRect().top < 0) {
          f.scrollIntoView({ block: "start", behavior: "instant" });
        }
      }

      function tabs() {
        const host = document.querySelector(".filters");
        host.innerHTML = TYPES.map(
          (t) =>
            `<button class="${CHIP}" role="tab" data-type="${esc(t)}"` +
            ` aria-selected="${t === active}">${esc(t)}</button>`,
        ).join("");
        host.querySelectorAll("button").forEach((b) => {
          b.onclick = () => {
            active = b.dataset.type;
            page = 1;
            host.querySelectorAll("button").forEach((x) =>
              x.setAttribute("aria-selected", String(x === b)),
            );
            render();
            // 탭마다 목록 길이가 달라, 스크롤한 채로 탭을 바꾸면 화면이
            // 제각각인 위치에 떨어집니다. 늘 같은 자리에서 시작하게 합니다.
            toTop();
          };
        });
      }

      // 박스오피스와 예매 링크는 없어도 페이지가 뜨도록 따로 받습니다.
      // 손으로 고른 작품만 있어도 목록은 성립하기 때문입니다.
      const optional = (url) =>
        fetch(url)
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null);

      Promise.all([
        fetch("assets/content-data.json").then((r) => r.json()),
        optional("assets/boxoffice.json"),
        optional("assets/anime.json"),
        optional("assets/tv-ranking.json"),
      ])
        .then(([d, box, anime, tv]) => {
          DATA = d;
          DATA.boxoffice = Array.isArray(box?.movies) ? box.movies : [];
          DATA.anime = Array.isArray(anime?.works) ? anime.works : [];
          /*
           * 자동 TV 데이터가 2주 넘게 멈춰 있으면 쓰지 않습니다.
           * 그 경우 드라마·예능 탭은 손으로 고른 작품만 남습니다 —
           * 줄어들긴 해도 지금 방영 중이라고 거짓말하지는 않습니다.
           */
          DATA.tv = isRecentDate(tv?.updatedAt, 14)
            ? [
                ...(Array.isArray(tv?.drama) ? tv.drama : []),
                ...(Array.isArray(tv?.variety) ? tv.variety : []),
              ]
            : [];
          FRESH = isFresh(box?.latestDt);
          // 손으로 고른 작품이 지금 차트에도 있으면 그 순위를 씁니다.
          // 같은 작품에 옛 근거 문구와 오늘 순위가 따로 놀지 않도록.
          for (const m of DATA.boxoffice) {
            if (m.rank) RANKS.set(key(m.title), m.rank);
          }
          // 포스터 출처를 방침 안내에 함께 적습니다. 어디서 온 이미지인지
          // 밝히지 않으면 출처 표기 없이 남의 이미지를 싣는 셈이 됩니다.
          const sources = [
            ...new Set(
              [...DATA.boxoffice, ...DATA.anime, ...DATA.tv]
                .map((x) => x.posterCredit)
                .filter(Boolean),
            ),
          ];
          // TMDB 이용 약관이 요구하는 출처 표기입니다. 푸터에 한 줄로 둡니다.
          if (sources.length)
            document.querySelector("#poster-credit").textContent =
              `포스터 출처: ${sources.join(", ")}`;
          tabs();
          render();
        })
        .catch(() => {
          document.querySelector("#sections").innerHTML =
            '<p class="empty">작품 정보를 불러오지 못했습니다.</p>';
        });
    </script>
  </body>
</html>
